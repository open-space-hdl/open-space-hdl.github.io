# Open Space Composer: unit tests, type check, catalog check against the pinned core repositories, schema validation
# of the example systems, and the browser tests in Chromium, Firefox and WebKit against a Jekyll build of the site
# with the gem set of GitHub Pages. The site itself is published by the legacy Pages build, not by this workflow.
name: Composer

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: composer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model:
    name: Unit tests, type check, catalog and schema
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the site
        uses: actions/checkout@v7
        with:
          path: site
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Python packages
        run: python -m pip install --quiet pyyaml jsonschema
      - name: Clone the core repositories (next to the site, full history for the pin check)
        run: python site/tools/composer_catalog.py clone
      - name: Catalog check (YAML against the VHDL entities at the pinned commits, catalog.json current, examples valid)
        run: python site/tools/composer_catalog.py check
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Node packages
        working-directory: site/tests
        run: npm ci
      - name: Unit tests
        working-directory: site/tests
        run: npm run unit
      - name: Type check
        working-directory: site/tests
        run: npm run typecheck
      - uses: ghdl/setup-ghdl@v1
        with:
          version: latest
          backend: mcode
      # Every example, the system of a user (tests/fixtures/spfi_encrypt.composer.json) and the fixture of subsystems
      # (two levels, the outer one used twice) are exported with the command line tool and analysed with GHDL file by
      # file in the order of their compile order file, then their top level is elaborated and run to 0 ns. Open Logic is
      # analysed with -frelaxed: its RAMs use a shared variable without a protected type (the RAM inference pattern of
      # Open Logic, upstream code that stays as it is). The cores, the generated subsystems and top levels are analysed
      # strictly. Vendor-specific blocks are simulated with their behavioural model where the catalog names one, else
      # replaced by a stub of their entity (tools/composer_hdl_check.py).
      - name: VHDL export of the examples, a user's system and subsystems, run to 0 ns with GHDL
        run: |
          set -eo pipefail
          for f in site/assets/composer/examples/*.composer.json site/tests/fixtures/spfi_encrypt.composer.json site/tests/fixtures/subsystems/*.composer.json; do
            n=$(basename "$f" .composer.json)
            node site/tools/composer_hdl.mjs "$f" "export/$n"
            python site/tools/composer_hdl_check.py "export/$n" --sources sources --checkout-from . 2>&1 | tee -a export.log
          done
      # Negative test: a top level whose generics violate an assertion of a core (ReleaseBytes_g = 4128, not a power of
      # two) must stop at 0 ns. The command line tool refuses this system, so a test-only script writes the export.
      - name: The GHDL check stops a top level that violates an assertion of a core
        run: |
          node site/tests/export_unchecked.mjs site/tests/fixtures/invalid/spfi_encrypt_release_4128.composer.json export/invalid
          if python site/tools/composer_hdl_check.py export/invalid --sources sources --checkout-from . > invalid.log 2>&1; then
            cat invalid.log
            echo "The GHDL check passed a top level that violates an assertion of a core."
            exit 1
          fi
          grep "ReleaseBytes_g must be a power of two" invalid.log || { cat invalid.log; echo "The GHDL check stopped the top level for another reason."; exit 1; }
      # Negative test: the GHDL check replaces a vendor-specific block by a stub and does not analyse its further files
      # (files in the catalog, for example its architecture), so it must stop when the compile order does not list such
      # a file or the sources do not have it. A test catalog names a file that no repository has.
      - name: The GHDL check stops when a further file of a vendor-specific block is missing
        run: |
          node site/tests/vendor_files_catalog.mjs vendor_files.json
          # the export with the published catalog does not list the file
          node site/tools/composer_hdl.mjs site/assets/composer/examples/spacefibre_node.composer.json export/vf_unlisted
          if python site/tools/composer_hdl_check.py export/vf_unlisted --sources sources --checkout-from . --catalog vendor_files.json > vf_unlisted.log 2>&1; then
            cat vf_unlisted.log
            echo "The GHDL check passed a compile order without a further file of a vendor-specific block."
            exit 1
          fi
          grep "ofb_pa_gty_absent.vhd, a file of the vendor-specific block ofb_pa_gty, is not listed" vf_unlisted.log || { cat vf_unlisted.log; echo "The GHDL check stopped for another reason."; exit 1; }
          # the export with the test catalog lists the file, which the sources do not have
          node site/tools/composer_hdl.mjs site/assets/composer/examples/spacefibre_node.composer.json export/vf_absent --catalog vendor_files.json
          if python site/tools/composer_hdl_check.py export/vf_absent --sources sources --checkout-from . --catalog vendor_files.json > vf_absent.log 2>&1; then
            cat vf_absent.log
            echo "The GHDL check passed a further file of a vendor-specific block that the sources do not have."
            exit 1
          fi
          grep "ofb_pa_gty_absent.vhd, a file of the vendor-specific block ofb_pa_gty, is not in sources" vf_absent.log || { cat vf_absent.log; echo "The GHDL check stopped for another reason."; exit 1; }
      # A vendor-specific block with a behavioural model in the catalog (model: a file list of its repository and an
      # architecture in plain VHDL) is simulated with that model, ofb_pa_gty in the step above. Without a model it is
      # replaced by a stub: a test-only edit of the catalog sources removes the model of ofb_pa_gty, the catalog is
      # built again, and spacefibre_node must elaborate and run to 0 ns with the stub. The last step of the job: it
      # changes the catalog of this checkout.
      - name: The GHDL check replaces a vendor-specific block without a model by a stub
        run: |
          grep "spacefibre_node: .* (1 vendor model (mdl), 1 vendor file not analysed)" export.log || { echo "The GHDL check did not simulate ofb_pa_gty with its model."; exit 1; }
          grep "spfi_encrypt: .* (1 vendor model (mdl), 1 vendor file not analysed)" export.log || { echo "The GHDL check did not simulate ofb_pa_gty with its model."; exit 1; }
          node site/tests/vendor_stub_yaml.mjs
          python site/tools/composer_catalog.py build
          node site/tools/composer_hdl.mjs site/assets/composer/examples/spacefibre_node.composer.json export/vs
          python site/tools/composer_hdl_check.py export/vs --sources sources --checkout-from . > vs.log 2>&1 || { cat vs.log; exit 1; }
          cat vs.log
          grep "spacefibre_node: .* (1 vendor stub, 1 vendor file not analysed), top level elaborated and run to 0 ns" vs.log || { echo "The GHDL check did not replace ofb_pa_gty by a stub."; exit 1; }

  browser:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Check out the site
        uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Jekyll with the gem set of GitHub Pages
        env:
          BUNDLE_GEMFILE: tests/jekyll/Gemfile
        run: bundle install --jobs 4
      - name: Build the site
        env:
          BUNDLE_GEMFILE: tests/jekyll/Gemfile
        run: bundle exec jekyll build
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Node packages
        working-directory: tests
        run: npm ci
      - name: Browser
        working-directory: tests
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Browser tests
        working-directory: tests
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.browser }}
          path: tests/test-results/
          retention-days: 7
