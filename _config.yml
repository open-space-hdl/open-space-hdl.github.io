title: Open Space HDL
tagline: Open-source VHDL IP for spacecraft on-board data handling
description: >-
  Open-source VHDL IP for spacecraft on-board data handling: data link
  protocols such as SpaceWire, SpaceFibre and RMAP, signal processing
  functions and fault-tolerant building blocks, built on the Open Logic
  VHDL library.
url: https://openspacehdl.org
baseurl: ""
github_org: https://github.com/open-space-hdl

# Repos with their own GitHub Pages site are served at /<repo>/ by GitHub.
# Never create a folder here that has the same name as a repo.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
