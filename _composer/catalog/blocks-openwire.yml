# OpenWire blocks. Ports and generics come from the VHDL entity at the pinned commit (sources.yml).

blocks:
  - id: openwire/owr_core
    kind: core
    name: SpaceWire port
    group: openwire
    project: OpenWire
    source: openwire
    entity: owr_core
    path: hdl/owr_core/src/owr_core.vhd
    idPrefix: spw
    doc: https://openspacehdl.org/openwire/docs/user_guide.html
    summary: >-
      SpaceWire port according to ECSS-E-ST-50-12C Rev.1: encoding, data link and network services (packets,
      time-codes, distributed interrupts) with a register file.
    clocks:
      - { port: UserClk, primary: true, label: User, description: Packet and broadcast service ports (any frequency). }
      - port: LinkClk
        label: Link
        freqGeneric: LinkClkFreq_g
        description: Encoding and data link layers; the transmit bit period is n LinkClk periods (n = 1 to 255).
      - { port: MgmtClk, label: Management, description: Register file and interrupt (any frequency). }
    resets:
      - { port: Rst, active: high, sync: async, description: Asynchronous reset; the core synchronises its release in every domain. }
    generics:
      - name: LinkClkFreq_g
        label: Link clock frequency
        unit: Hz
        fromClock: LinkClk
        description: >-
          Frequency of LinkClk. It must lie within 10 % of a multiple of 10 MHz, so that 10 Mb/s +/- 10 % can be
          reached with an integer divider.
      - { name: TxFifoDepth_g, label: Transmit FIFO depth, check: pow2, description: Depth of the transmit FIFO in N-Chars (power of 2). }
      - { name: RxFifoDepth_g, label: Receive FIFO depth, check: pow2, description: Depth of the receive FIFO in N-Chars (power of 2); 64 or more allows seven outstanding FCTs. }
      - { name: TimeCodes_g, label: Time-code service, description: Enables the time-code service and its ports. }
      - { name: Interrupts_g, label: Interrupt service, description: Enables the distributed interrupt service and its ports. }
      - { name: IntTimerWidth_g, label: Interrupt timer width, advanced: true, enabledBy: Interrupts_g, description: Width of the minimum interval and acknowledgement delay of the interrupt service, in ticks. }
      - { name: LinkDisabled_g, label: Link disabled after reset, advanced: true, description: Reset value of LinkDisabled. }
      - { name: LinkStart_g, label: Link start after reset, description: Reset value of LinkStart; the port starts the link without software. }
      - { name: AutoStart_g, label: Auto start after reset, description: Reset value of AutoStart; the port starts the link when the far end does. }
      - { name: RunDiv_g, label: Run divider, advanced: true, description: Reset value of the bit period in the Run state in LinkClk cycles. }
      - { name: SyncStages_g, label: Synchroniser stages, advanced: true, description: Synchroniser stages of data and strobe. }
    interfaces:
      - name: S_Pkt
        label: Packets to send
        type: spw.nchar
        role: sink
        clock: UserClk
        signals: { data: S_Pkt_TData, last: S_Pkt_TLast, valid: S_Pkt_TValid, ready: S_Pkt_TReady }
      - name: M_Pkt
        label: Received packets
        type: spw.nchar
        role: source
        clock: UserClk
        mustServe: true
        description: Must be served; the port gives credit only for free places of the receive FIFO.
        signals: { data: M_Pkt_TData, last: M_Pkt_TLast, valid: M_Pkt_TValid, ready: M_Pkt_TReady }
      - name: S_Tc
        label: Time-codes to send
        type: spw.timecode
        role: sink
        clock: UserClk
        enabledBy: TimeCodes_g
        tieOff: default
        signals: { data: S_Tc_TData, valid: S_Tc_TValid, ready: S_Tc_TReady }
      - name: M_Tc
        label: Received time-codes
        type: spw.timecode
        role: source
        clock: UserClk
        enabledBy: TimeCodes_g
        tieOff: default
        signals: { data: M_Tc_TData, valid: M_Tc_TValid, ready: M_Tc_TReady }
      - name: S_Int
        label: Interrupts to send
        type: spw.int
        role: sink
        clock: UserClk
        enabledBy: Interrupts_g
        tieOff: default
        signals: { data: S_Int_TData, valid: S_Int_TValid, ready: S_Int_TReady }
      - name: S_IntAck
        label: Acknowledgements to send
        type: spw.intack
        role: sink
        clock: UserClk
        enabledBy: Interrupts_g
        tieOff: default
        signals: { data: S_IntAck_TData, valid: S_IntAck_TValid, ready: S_IntAck_TReady }
      - name: M_Int
        label: Received interrupts
        type: spw.int
        role: source
        clock: UserClk
        enabledBy: Interrupts_g
        tieOff: default
        signals: { data: M_Int_TData, valid: M_Int_TValid, ready: M_Int_TReady }
      - name: M_IntAck
        label: Received acknowledgements
        type: spw.intack
        role: source
        clock: UserClk
        enabledBy: Interrupts_g
        tieOff: default
        signals: { data: M_IntAck_TData, valid: M_IntAck_TValid, ready: M_IntAck_TReady }
      - name: S_AxiLite
        label: Registers
        type: axi4lite
        role: slave
        clock: MgmtClk
        prefix: S_AxiLite_
        params: { addrWidth: 8 }
      - name: Irq
        label: Interrupt
        type: irq
        role: event_out
        clock: MgmtClk
        tieOff: open
        signals: { irq: Irq }
        # the registers of the interrupt in the register map of the block (the brief gives their offsets)
        irqRegisters: { events: EVENTS, enable: [EVENTS_IRQ_EN, ERRORS_IRQ_EN], status: IRQ_STATUS }
      - name: Spw
        label: SpaceWire line
        type: spw.ds
        role: pins
        clock: LinkClk
        externalOnly: true
        signals: { d_out: Spw_DOut, s_out: Spw_SOut, d_in: Spw_DIn, s_in: Spw_SIn, tx_en: Phy_TxEn, rx_en: Phy_RxEn }
    rules:
      - { kind: clock_freq_multiple, clock: LinkClk, multipleHz: 10.0e6, tolerance: 0.1 }
      # hdl/owr_core/src/owr_core.vhd (CORE-CF-02): with the multiple of 10 MHz the ranges 18 to 22, 27 to 33, 36 to 44 and
      # 45 to 2554 MHz; the initial divider round(LinkClkFreq_g / 10 MHz) of owr_pkg.vhd is at most 255
      - { kind: generic_range, generic: LinkClkFreq_g, min: 13200000, message: "the receiver samples the initial rate of the far end, at most 11 Mb/s, with 1.2 LinkClk periods per bit (CORE-CF-02)" }
      - { kind: generic_range, generic: LinkClkFreq_g, max: 2554999999, message: "LINK_SPEED.INIT_DIV, round(LinkClkFreq_g / 10 MHz), is an 8-bit field: below 2555 MHz (CORE-CF-02)" }
      - { kind: run_rate, clock: LinkClk, divider: RunDiv_g, sampling: 1.2, message: "A receiver samples a bit period that is longer than 1.2 of its LinkClk periods (user guide, section 3)" }
      # a flow control token needs room for 8 N-Chars plus the place the receiver keeps for an EEP
      - { kind: generic_range, generic: RxFifoDepth_g, min: 16, message: "the port never has room for a flow control token: 8 N-Chars plus the reserved EEP place; it receives no data" }
      # the register map reports depth and fill level of both FIFOs in 16-bit fields
      - { kind: generic_range, generic: RxFifoDepth_g, max: 32768, message: "FIFO_DEPTHS and FIFO_LEVELS are 16-bit fields" }
      - { kind: generic_range, generic: TxFifoDepth_g, max: 32768, message: "FIFO_DEPTHS and FIFO_LEVELS are 16-bit fields" }
      # the transmit FIFO of Open Logic holds at least 2 N-Chars (CORE-CF-01)
      - { kind: generic_range, generic: TxFifoDepth_g, min: 2, message: "the Open Logic FIFO holds at least 2 entries (CORE-CF-01)" }
    idRegister: { address: "0x00", value: "0x4F575201" }
    registers: { map: hdl/owr_mib/regs/owr_regs.yml, header: sw/owr_regs.h, doc: hdl/owr_mib/docs/register_map.md, prefix: OWR }
    # the ECC of the memories inside the core: double-error flags per channel, counters, error injection
    protection:
      evidence: "user guide section 5 (protection scope) and the register map"
      ecc: { status: ECC_STATUS, select: ECC_SELECT, count: ECC_COUNT, inject: ECC_INJECT }
    init:
      - { text: "Optionally write LINK_SPEED (0x14) bits 7:0 RUN_DIV: the bit period in the Run state in LinkClk cycles (reset value RunDiv_g); choose it for the far end, which samples at most about LinkClk / 1.2." }
      - { text: "Write PORT_CTRL (0x10) = 0x34 (RECEIVER_EN, DRIVER_EN, LINK_START) to start the link, or 0x38 (AUTO_START) to wait for the far end.", unless: [LinkStart_g, AutoStart_g] }
      - { text: "The link starts after the reset without software (LinkStart_g or AutoStart_g).", when: [LinkStart_g] }
      - { text: "The link starts after the reset without software (LinkStart_g or AutoStart_g).", when: [AutoStart_g], unless: [LinkStart_g] }
      - { text: "Wait for PORT_STATUS (0x18) bits 2:0 LINK_STATE = 5 (Run) before packets are exchanged." }
    endToEnd: "Loop the SpaceWire line back (Spw_DOut to Spw_DIn, Spw_SOut to Spw_SIn) or connect a second port, start the link and wait for PORT_STATUS LINK_STATE = 5 (Run)."
    constraints:
      - { kind: false_path, fromPorts: [Spw_DIn, Spw_SIn, Rst] }
      - { kind: max_delay_pairs, clocks: [UserClk, LinkClk, MgmtClk], note: "Clock crossings inside the core (Open Logic FT FIFOs and synchronisers): for every pair of its clocks, in both directions, the period of the faster clock; no asynchronous clock groups." }
      - { kind: io_register, ports: [Spw_DOut, Spw_SOut], note: Place the output flip-flops of data and strobe in the I/O blocks with matched routing. }
    notes:
      - LVDS output buffers for data and strobe and LVDS input buffers with fail-safe biasing belong to the top level; the core contains no I/O buffer.
      - Enable the safe implementation of state machines in the synthesis tool.
      - Set INT_HOLDOFF and INT_ACK_DELAY for the network before distributed interrupts are used.
      - Serve the indication ports before the indication FIFO (16 entries) fills.
      - Write registers as 32-bit words; a read that depends on a write waits for the write response.
    rates:
      evidence: "user guide section 7; TC-DL-43 (one N-Char per UserClk cycle at the packet ports), TC-DL-40 and TC-CORE-11 (link rate in one and in both directions), TC-EN-03 (run dividers)"
      packet: packet
      interfaces:
        S_Pkt: { bytesPerBeat: 1, extraBeats: 1 }      # the end of packet marker is a beat without a byte
        M_Pkt: { bytesPerBeat: 1, extraBeats: 1 }
      links:
        - interface: Spw
          from: S_Pkt
          to: M_Pkt
          # payload bytes per second at the bit rate R = LinkClk / RunDiv_g (reset value of LINK_SPEED.RUN_DIV): ten
          # bits per data character, four per end marker; in both directions also one FCT per eight N-Chars received
          capacity: "n * Freq_LinkClk / RunDiv_g / (10 * n + 4)"
          capacityBoth: "n * Freq_LinkClk / RunDiv_g / (10.5 * n + 4.5)"
          note: "the bit rate follows RunDiv_g, the reset value of LINK_SPEED.RUN_DIV; software can change it"
    sizes:
      evidence: "no length limit by design: N-Chars stream through N-Char FIFOs without a packet concept, the only counter of the data path is the credit (owr_data_link.vhd); packets of up to 65542 bytes simulated, also with a link error in the middle (TC-CORE-17, TC-CORE-18, user guide section 7)"
      interfaces:
        S_Pkt: { noLimit: true, tested: 65542 }
        M_Pkt: { noLimit: true, tested: 65542 }
