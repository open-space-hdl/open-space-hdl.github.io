# OpenCrypto blocks. Ports and generics come from the VHDL entity at the pinned commit (sources.yml).

blocks:
  - id: opencrypto/ocr_core
    kind: core
    name: AES-GCM core
    group: opencrypto
    project: OpenCrypto
    source: opencrypto
    entity: ocr_core
    path: hdl/ocr_core/src/ocr_core.vhd
    packages: [hdl/ocr_pkg/src/ocr_pkg.vhd]
    idPrefix: ocr
    doc: https://openspacehdl.org/opencrypto/docs/user_guide.html
    summary: >-
      AES-GCM authenticated encryption and decryption (FIPS 197, NIST SP 800-38D, CCSDS 352.0-B-2) with a key table,
      IV generation per key slot and a register file; one message per context, one status per message.
    clocks:
      - { port: Clk, primary: true, label: Clock, description: All of the core; one beat per cycle on every stream. }
    resets:
      - { port: Rst, active: high, sync: sync, clock: Clk }
    generics:
      - { name: DataWidth_g, label: Stream width, unit: bits, choices: [16, 32, 64, 128], description: Width of the message streams. }
      - { name: KeyBits_g, label: Key length, unit: bits, choices: [128, 192, 256], description: One key length per core; CCSDS 352.0-B-2 uses 256 bits for new missions. }
      - { name: NumKeys_g, label: Key slots, description: Slots of the key table; the slot fields have max(1, ceil(log2(NumKeys_g))) bits. }
      - { name: AesUnits_g, label: AES round units, advanced: true, description: Round units of the AES engine; 0 selects the default of the width. }
      - { name: GhashDigit_g, label: GHASH digit, unit: bits, choices: [0, 16, 32, 64, 128], advanced: true, description: Bits per cycle of the GHASH multiplier, DataWidth_g to 128; 0 selects the default of the width. }
      - { name: LenBits_g, label: Length bits, advanced: true, description: Width of the byte counts of the AAD and DATA sections. }
      - { name: ReleaseBuffer_g, label: Release buffer, description: A message leaves the core only when its status is OK (plaintext only after the tag is verified). }
      - { name: ReleaseBytes_g, label: Release buffer size, unit: bytes, enabledBy: ReleaseBuffer_g, description: "Power of two of at least 16 beats that holds the longest message in whole beats (IV, AAD, data and tag each start a new beat); longer messages are dropped with OVERFLOW, two messages give the full rate." }
      - { name: DenseOutput_g, label: Dense output, description: "Every output message leaves as one gapless byte string IV, AAD, DATA, TAG; needed where the output is a byte stream (for example a send port of OpenSPP)." }
      - { name: ClkFreqHz_g, label: Clock frequency, unit: Hz, fromClock: Clk, advanced: true, description: Clock frequency for the pacer of the key table scrubbers. }
      - { name: ScrubPeriod_g, label: Scrub period, unit: s, advanced: true, description: Scrub period of the key table; 0 scrubs in every cycle without access. }
    interfaces:
      - name: S_Ctx
        label: Contexts
        type: gcm.ctx
        role: sink
        clock: Clk
        tieOff: zero
        description: One context per message, in the order of the messages (direction, key slot, IV source, IV).
        signals: { valid: S_Ctx_Valid, ready: S_Ctx_Ready, decrypt: S_Ctx_Decrypt, slot: S_Ctx_Slot, iv_gen: S_Ctx_IvGen, iv: S_Ctx_Iv }
      - name: S_In
        label: Messages in
        type: gcm.msg
        role: sink
        clock: Clk
        tieOff: zero
        description: "One message per packet; user is the section of the beat: 11 IV, 01 AAD, 00 DATA, 10 TAG."
        signals: { data: S_In_Data, keep: S_In_Keep, last: S_In_Last, user: S_In_User, valid: S_In_Valid, ready: S_In_Ready }
        sideband:
          signal: user
          description: "Section of every beat when the input is a plain byte stream: 0 DATA (encrypt the whole packet), 1 AAD (authenticate only)."
          fields:
            - { name: section, label: "Section (0 DATA, 1 AAD)", lsb: 0, bits: 2, kind: integer, default: 0 }
      - name: M_Out
        label: Messages out
        type: gcm.msg
        role: source
        clock: Clk
        tieOff: default
        description: "user(1:0) is the section of the beat (dense output: of its first byte), user(2) the error flag on the last beat."
        signals: { data: M_Out_Data, keep: M_Out_Keep, last: M_Out_Last, user: M_Out_User, valid: M_Out_Valid, ready: M_Out_Ready }
        userFields:
          - { name: section, label: "Section of the beat (dense output: of its first byte): 11 IV, 01 AAD, 00 DATA, 10 TAG", lsb: 0, bits: 2 }
          - { name: error, label: "Error flag on the last beat: the status of the message is not OK", lsb: 2, bits: 1 }
      - name: M_Sts
        label: Status
        type: gcm.sts
        role: source
        clock: Clk
        tieOff: default
        description: One status per message; ready may stay '1' when the status is not used.
        signals: { valid: M_Sts_Valid, ready: M_Sts_Ready, code: M_Sts_Code, decrypt: M_Sts_Decrypt, slot: M_Sts_Slot, iv: M_Sts_Iv, aad_bytes: M_Sts_AadBytes, data_bytes: M_Sts_DataBytes }
      - name: S_AxiLite
        label: Registers
        type: axi4lite
        role: slave
        clock: Clk
        prefix: S_AxiLite_
        params: { addrWidth: 8 }
      - name: Irq
        label: Interrupt
        type: irq
        role: event_out
        clock: Clk
        tieOff: open
        signals: { irq: Irq }
    idRegister: { address: "0x000", value: "0x4F435201" }
    registers: { map: hdl/ocr_mib/regs/ocr_regs.yml, header: sw/ocr_regs.h, doc: hdl/ocr_mib/docs/register_map.md, prefix: OCR }
    init:
      - { text: "After the reset wait until STATUS (0x014) bit 0 BUSY is 0: the key table erases every slot." }
      - { text: "Load every key slot in use: write the key to KEY0 to KEY7 (0x040 + 4 n; key byte 4 n in bits 31:24; 4, 6 or 8 words), for generated IVs the fixed field to IV_FIXED (0x060) and the first invocation counter to IV_COUNT_LO (0x064) and IV_COUNT_HI (0x068), then write KEY_LOAD (0x06C) with START (bit 31), IV_GEN (bit 8) and the slot (bits 7:0), for example 0x80000100 for slot 0 with generated IVs; wait until STATUS.BUSY is 0." }
    endToEnd: "Load the key slot, send a packet and check the output: with generated IVs the first 4 bytes of every message are IV_FIXED, the next 8 the invocation counter; decrypt it with AES-GCM in the test bench (or a second core) and compare."
    rules:
      # ocr_gcm.vhd and ocr_aes_engine.vhd: ceil(Nr / R) round units sustain one beat per cycle, at most Nr of them
      - { kind: generic_range, generic: AesUnits_g, min: (KeyBits_g / 32 + 5 + 128 / DataWidth_g) / (128 / DataWidth_g), max: KeyBits_g / 32 + 6, unlessZero: true, message: "the AES engine sustains one beat per cycle with ceil(Nr / R) round units and has Nr rounds" }
      # ocr_gcm.vhd: the GHASH digit covers a beat
      - { kind: generic_range, generic: GhashDigit_g, min: DataWidth_g, unlessZero: true }
      # ocr_gcm.vhd: the depth of the release buffer is a positive number of beats also when the buffer is not used
      - { kind: generic_range, generic: ReleaseBytes_g, min: DataWidth_g / 8 }
      # olo_ft_private_scrubber.vhd (key table): a scrub period of at least 1 ms, or 0
      - { kind: generic_range, generic: ScrubPeriod_g, min: 0.001, unlessZero: true }
      # hdl/ocr_gcm/src/ocr_gcm.vhd: the release buffer is a power of two of at least 16 beats
      - { kind: generic_multiple, generic: ReleaseBytes_g, of: 16 * DataWidth_g / 8, pow2Ratio: true, when: ReleaseBuffer_g, message: "the release buffer holds a power of two of at least 16 beats" }
      - kind: partner_requires
        interface: M_Out
        types: [byte.stream, spp.tx]
        generic: DenseOutput_g
        value: true
        message: >-
          Set DenseOutput_g = true, so that every message leaves as one gapless byte string (IV, AAD, ciphertext,
          tag); the sectioned output is for the input of a second core (decryption).
      - kind: flag_dropped
        interface: M_Out
        signal: user
        bit: 2
        unlessGeneric: ReleaseBuffer_g
        unlessInterface: M_Sts
        message: >-
          The error flag of the messages (user bit 2 on the last beat) is not passed on, so a message that failed (for
          example with KEY) is sent like a good one. Set ReleaseBuffer_g = true (a message leaves the core only when its
          status is OK) with ReleaseBytes_g a power of two that holds the longest message in whole beats (IV, AAD,
          data and tag each start a new beat), or consume the status at M_Sts.
    notes:
      - Rst is synchronous and high-active; synchronise its release to Clk, for example with olo_base_reset_gen with SyncTmr_g = true.
      - After the reset the key table erases every slot (NumKeys_g cycles, STATUS.BUSY = '1'); no key survives a reset.
      - One context per message, in the order of the messages; the core pairs the n-th context with the n-th message.
      - Load every key slot in use through the registers before sending contexts (programming sequence of the user guide).
      - Without the release buffer, discard every decrypted message whose last beat carries the error flag or whose status is not OK.
      - Save the invocation counter of every slot with generated IVs regularly ahead of the operational value (GCM 9.1).
    rates:
      evidence: "TC-CO-10 and TC-CO-11 (back-to-back encryptions and decryptions without stall cycles, hdl/ocr_core/docs/verification_report.md)"
      packet: message
      # a message of n bytes in, without AAD; encryption with a generated IV assumed, the longest output (IV 12, tag 16)
      vars: { B: DataWidth_g / 8 }
      interfaces:
        S_In: { bytesPerBeat: B }
        # sectioned: IV, data and tag each start a beat; dense: packed, at most one cycle more per message (TC-CO-10)
        M_Out: { cycles: "DenseOutput_g * (cdiv(n, B) + 1) + (1 - DenseOutput_g) * (cdiv(12, B) + cdiv(n - 28, B) + cdiv(16, B))" }
      routes:
        - { from: S_In, to: M_Out, addBytes: "28" }
    sizes:
      evidence: "user guide section 2 (generics LenBits_g and ReleaseBytes_g) and section 8 (the release buffer holds the longest message); the cycles of a release buffer that holds one message but not two: user guide section 7.1, TC-CO-15 (the bound max(B + 2, 3 M - D + 4) for M sectioned beats in a buffer of D beats) and TC-CO-16 (framer chunks of 4096 bytes at 128 bit, hdl/ocr_core/docs/verification_report.md)"
      interfaces:
        S_In:
          limits:
            - { maxBytes: "2 ** LenBits_g - 1", over: rejected, why: "AAD and DATA have at most 2^LenBits_g - 1 bytes each (error LENGTH)" }
      buffers:
        # the release buffer holds a whole message in beats: IV, AAD with DATA (the core does not know their split, one
        # beat more where the AAD does not end on a beat) and the tag each start a new beat
        - interface: M_Out
          holds: ReleaseBytes_g
          enabledBy: ReleaseBuffer_g
          beat: DataWidth_g / 8
          sections: ["12", "n - 28", "16"]
          spareBeats: 1
          over: dropped with OVERFLOW
          fullRate: { messages: 2, cycles: "3 * m - d + 4", normal: "m + 1" }

  - id: opencrypto/ocr_framer
    kind: module
    name: Chunk framer
    group: opencrypto
    project: OpenCrypto
    source: opencrypto
    entity: ocr_framer
    path: hdl/ocr_framer/src/ocr_framer.vhd
    packages: [hdl/ocr_pkg/src/ocr_pkg.vhd]
    idPrefix: frm
    doc: https://openspacehdl.org/opencrypto/docs/user_guide.html
    summary: >-
      Cuts packets of any length into chunks of ChunkBytes_g bytes and hands every chunk to the AES-GCM core as one
      encryption with a generated IV and a 4-byte AAD with the position of the chunk in its packet.
    clocks:
      - { port: Clk, primary: true, label: Clock, description: The clock of the core. }
    resets:
      - { port: Rst, active: high, sync: sync, clock: Clk }
    generics:
      - { name: DataWidth_g, label: Stream width, unit: bits, choices: [16, 32, 64, 128], description: The DataWidth_g of the core; follows the connected core., follow: { interfaces: [M_Out, S_In], measure: data, rank: 1 } }
      - { name: NumKeys_g, label: Key slots, description: The NumKeys_g of the core (width of the slot); follows the connected core., follow: { interfaces: [M_Ctx], measure: generic, generic: NumKeys_g } }
      - { name: ChunkBytes_g, label: Chunk size, unit: bytes, check: multiple16, description: "Bytes of a chunk; the last chunk of a packet has the remaining bytes. A chunk leaves the core as ChunkBytes_g + 32 bytes (IV 12, AAD 4, tag 16)." }
      - { name: BufferChunks_g, label: Buffered chunks, description: Chunks that the chunk buffer holds; it takes the next chunk while one leaves. }
      - { name: RamStyle_g, label: RAM style, advanced: true, description: RAM style of the chunk buffer. }
    interfaces:
      - name: Cfg
        label: Key slot
        type: sig.control
        role: event_in
        clock: Clk
        tieOff: constant
        description: "Key slot of the contexts: loaded for generated IVs (IV_GEN = '1') and unchanged while the framer holds chunks."
        signals: { slot: Cfg_Slot }
        sideband:
          signal: slot
          description: Static key slot of the contexts, set as a constant of the instance.
          fields:
            - { name: slot, label: Key slot, lsb: 0, bits: 8, kind: integer, default: 0, below: NumKeys_g }
      - name: S_In
        label: Packets in
        type: byte.stream
        role: sink
        clock: Clk
        tieOff: zero
        description: Packets of any length (for example one compressed image each); last is the end of the packet.
        signals: { data: S_In_Data, keep: S_In_Keep, last: S_In_Last, valid: S_In_Valid, ready: S_In_Ready }
      - name: M_Ctx
        label: Contexts
        type: gcm.ctx
        role: source
        clock: Clk
        mustServe: true
        description: One encryption context per chunk, to S_Ctx of the core.
        signals: { valid: M_Ctx_Valid, ready: M_Ctx_Ready, decrypt: M_Ctx_Decrypt, slot: M_Ctx_Slot, iv_gen: M_Ctx_IvGen, iv: M_Ctx_Iv }
      - name: M_Out
        label: Messages out
        type: gcm.msg
        role: source
        clock: Clk
        mustServe: true
        description: AAD section with the position of the chunk, then the chunk as DATA section, to S_In of the core.
        signals: { data: M_Out_Data, keep: M_Out_Keep, last: M_Out_Last, user: M_Out_User, valid: M_Out_Valid, ready: M_Out_Ready }
        userFields:
          - { name: section, label: "Section of the beat: 01 AAD, 00 DATA", lsb: 0, bits: 2 }
      - { name: Ecc, label: EDAC events, type: ecc.event, role: event_out, clock: Clk, vector: "2", tieOff: open, description: "Element 0 the chunk buffer, element 1 the position FIFO.", signals: { sec: Ecc_Sec, ded: Ecc_Ded } }
      - { name: ErrInj, label: Error injection, type: ecc.inject, role: event_in, clock: Clk, tieOff: default, description: Tests only., signals: { sel: ErrInj_Sel, bitflip: ErrInj_BitFlip, valid: ErrInj_Valid } }
    rules:
      - { kind: same_domain, interfaces: [M_Ctx, M_Out], message: "The framer and the core share clock and reset; a reset of only one of them leaves contexts or messages without partner." }
    init:
      - { text: "Load the key slot Cfg_Slot of the AES-GCM core for generated IVs (KEY_LOAD with IV_GEN = '1', see the core) before the first packet; without a loaded slot every chunk fails with KEY." }
    notes:
      - The slot Cfg_Slot is loaded for generated IVs and stays unchanged while the framer holds chunks.
      - Every chunk consumes one invocation of the slot; save the counter regularly (GCM 9.1).
      - A receiver decrypts every chunk on its own (IV bytes 0 to 11, AAD bytes 12 to 15, tag the last 16 bytes), orders the chunks by the invocation counter and finds the packet boundaries in the positions.
    rates:
      evidence: "TC-FR-03 (four long packets without stall cycles, at most AadBeats + 2 cycles per chunk, hdl/ocr_framer/docs/verification_report.md)"
      packet: chunk
      vars: { B: DataWidth_g / 8 }
      interfaces:
        S_In: { bytesPerBeat: B, overheadCycles: "cdiv(n, ChunkBytes_g) * (cdiv(4, B) + 2)" }   # input pauses per chunk
        M_Out: { cycles: "cdiv(4, B) + cdiv(n - 4, B)" }                    # AAD (position) and the chunk
      routes:
        - { from: S_In, to: M_Out, chunk: ChunkBytes_g, addBytes: "4" }
      # the framer in front of the core with the dense output: every chunk takes exactly C cycles, for a message of n
      # bytes at the output of the framer (the chunk and its 4 bytes of AAD)
      chains:
        - from: M_Out
          to: { block: opencrypto/ocr_core, in: S_In, out: M_Out, when: DenseOutput_g }
          cycles: "cdiv(12, B) + cdiv(4, B) + cdiv(n - 4, B) + cdiv(16, B) + min(1, (n - 4) mod B)"
          evidence: "user guide section 7.2 and TC-FR-08 (framer and core with the dense output, C(n) exactly at 16, 32, 64 and 128 bit, hdl/ocr_framer/docs/verification_report.md)"
    sizes:
      evidence: "user guide section 4.6: every packet is cut into chunks of ChunkBytes_g bytes"
      interfaces:
        S_In: { noLimit: true }
      chains:
        # the release buffer of the core behind the framer: IV, AAD (the position), the chunk and the tag each start a
        # beat (n: the message at M_Out of the framer, the chunk and its 4 bytes of AAD)
        - from: M_Out
          to: { block: opencrypto/ocr_core, in: S_In, out: M_Out }
          sections: ["12", "4", "n - 4", "16"]
