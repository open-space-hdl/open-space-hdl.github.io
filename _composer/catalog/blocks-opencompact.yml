# OpenCompact blocks. Ports and generics come from the VHDL entity at the pinned commit (sources.yml).

blocks:
  - id: opencompact/ocp_core
    kind: core
    name: CCSDS 123.0-B-2 compressor
    group: opencompact
    project: OpenCompact
    source: opencompact
    entity: ocp_core
    path: hdl/ocp_core/src/ocp_core.vhd
    packages: [hdl/ocp_pkg/src/ocp_pkg.vhd]
    idPrefix: ocp
    doc: https://openspacehdl.org/opencompact/docs/user_guide.html
    summary: >-
      Lossless and near-lossless compression of multispectral and hyperspectral images (CCSDS 123.0-B-2) with all
      predictors, quantizers and entropy coders of the standard; every parameter is a generic, the header of the
      compressed image follows from them.
    clocks:
      - { port: Clk, primary: true, label: Clock, description: All of the core. }
    resets:
      - { port: Rst, active: high, sync: sync, clock: Clk }
    generics:
      # Image and compressed image (user guide 2.1)
      - { name: XSize_g, label: Image width (NX), unit: samples, description: Samples per row of every band (CCSDS 5.3.2.2). }
      - { name: YSize_g, label: Image height (NY), unit: rows, description: Rows of every band. }
      - { name: ZSize_g, label: Bands (NZ), description: Spectral bands of the image. }
      - { name: DynamicRange_g, label: Dynamic range (D), unit: bits, description: Bits per sample; the width of In_Data. }
      - { name: SignedSamples_g, label: Signed samples, description: Samples in two's complement (Sample Type). }
      - { name: UserData_g, label: User-defined data, advanced: true, description: User-Defined Data field of the header. }
      - { name: EncodingOrder_g, label: Encoding order, choices: [BI, BSQ], description: "Sample encoding order and input order (CCSDS 5.4.2): BI band-interleaved by groups of M bands, BSQ band-sequential." }
      - { name: SubFrameDepth_g, label: Sub-frame depth (M), description: "BI order: bands per group, 1 to NZ; M = NZ is BIP, M = 1 is BIL." }
      - { name: OutputWordSize_g, label: Output word size (B), unit: bytes, description: The compressed image is a multiple of B bytes (CCSDS 5.2.2). }
      - { name: EntropyCoder_g, label: Entropy coder, choices: [SAMPLE_ADAPTIVE, HYBRID, BLOCK_ADAPTIVE], description: Entropy coder of the compressed image (CCSDS 5.4.3). }
      - { name: SupTableCount_g, label: Supplementary tables, advanced: true, description: Number of supplementary information tables in the header. }
      - { name: SupTableData_g, label: Supplementary table data, advanced: true, description: "The Supplementary Information Tables subpart as encoded by the user (CCSDS 5.3.2.3); tools/ocp_generics.py sup_table_hex produces it." }
      # Predictor (user guide 2.2)
      - { name: PredictionBands_g, label: Prediction bands (P), description: Preceding bands used for prediction (CCSDS 4.2). }
      - { name: PredictionMode_g, label: Prediction mode, choices: [FULL, REDUCED], description: Full or reduced prediction (CCSDS 4.3). }
      - { name: LocalSum_g, label: Local sum type, choices: [WIDE_NEIGHBOR, NARROW_NEIGHBOR, WIDE_COLUMN, NARROW_COLUMN], description: Local sums of the predictor (CCSDS 4.4). }
      - { name: RegisterSize_g, label: Register size (R), unit: bits, advanced: true, description: "max(32, D + Omega + 2) to 64 (CCSDS 4.7.2)." }
      - { name: WeightResolution_g, label: Weight resolution (Omega), unit: bits, advanced: true, description: Weight component resolution (CCSDS 4.6.1). }
      - { name: WeightUpdateInterval_g, label: Weight update interval, advanced: true, description: log2 of the weight update scaling exponent change interval tinc (CCSDS 4.10.2). }
      - { name: WeightUpdateVmin_g, label: Weight update vmin, advanced: true, description: Initial weight update scaling exponent parameter. }
      - { name: WeightUpdateVmax_g, label: Weight update vmax, advanced: true, description: Final weight update scaling exponent parameter. }
      - { name: WeightExpOffsetsUsed_g, label: Weight exponent offsets, advanced: true, description: Weight exponent offsets are used (CCSDS 4.10.4). }
      - { name: WeightExpOffsetTable_g, label: Weight exponent offset table, advanced: true, enabledBy: WeightExpOffsetsUsed_g, description: The offsets are written into the header (CCSDS 5.3.3.3.3). }
      - { name: WeightExpOffsets_g, label: Weight exponent offsets per band, advanced: true, enabledBy: WeightExpOffsetsUsed_g, description: "Per band the intra-band offset (full mode), then the inter-band offsets, -6 to 5; the last element repeats for the remaining bands." }
      - { name: CustomWeights_g, label: Custom weight initialisation, advanced: true, description: Weight initialisation method (CCSDS 4.6.3). }
      - { name: WeightInitTable_g, label: Weight initialisation table, advanced: true, enabledBy: CustomWeights_g, description: The initial weights are written into the header (CCSDS 5.3.3.3.2). }
      - { name: WeightInitResolution_g, label: Weight initialisation resolution (Q), unit: bits, advanced: true, enabledBy: CustomWeights_g, description: 3 to Omega + 3. }
      - { name: WeightInitValues_g, label: Initial weights per band, advanced: true, enabledBy: CustomWeights_g, description: "Per band the Cz components as Q-bit signed values, in the order of the table." }
      # Quantizer and sample representatives (user guide 2.3)
      - { name: Fidelity_g, label: Fidelity control, choices: [LOSSLESS, ABSOLUTE, RELATIVE, ABSOLUTE_RELATIVE], description: Lossless compression or near-lossless compression with absolute and relative error limits (CCSDS 4.8.2.1). }
      - { name: PeriodicUpdate_g, label: Periodic error limit updating, description: "The error limits come from the Lim port at every 2^u frames (BI order, CCSDS 4.8.2.4)." }
      - { name: UpdatePeriodExp_g, label: Update period exponent (u), enabledBy: PeriodicUpdate_g, description: The limits are read at every frame y with y mod 2^u = 0. }
      - { name: AbsBandDependent_g, label: Band-dependent absolute limits, description: "ABSOLUTE and ABSOLUTE_RELATIVE: one absolute error limit per band." }
      - { name: AbsBitDepth_g, label: Absolute limit bit depth (DA), unit: bits, description: 1 to min(D - 1, 16). }
      - { name: AbsErrorLimits_g, label: Absolute error limits, description: "Per band (or the first element for all bands); not used with periodic updating." }
      - { name: RelBandDependent_g, label: Band-dependent relative limits, description: "RELATIVE and ABSOLUTE_RELATIVE: one relative error limit per band." }
      - { name: RelBitDepth_g, label: Relative limit bit depth (DR), unit: bits, description: 1 to min(D - 1, 16). }
      - { name: RelErrorLimits_g, label: Relative error limits, description: "Per band (or the first element for all bands); not used with periodic updating." }
      - { name: SampleRepResolution_g, label: Sample representative resolution (Theta), advanced: true, description: "0 to 4; above 0 the header has the Sample Representative subpart (CCSDS 5.3.3.5)." }
      - { name: DampingBandVarying_g, label: Band-varying damping, advanced: true, description: One damping value per band. }
      - { name: DampingTable_g, label: Damping table, advanced: true, description: The damping values are written into the header. }
      - { name: Damping_g, label: Damping (phi), advanced: true, description: "0 to 2^Theta - 1, per band where band-varying (CCSDS 4.9.1)." }
      - { name: OffsetBandVarying_g, label: Band-varying offset, advanced: true, description: One offset value per band. }
      - { name: OffsetTable_g, label: Offset table, advanced: true, description: The offset values are written into the header. }
      - { name: Offset_g, label: Offset (psi), advanced: true, description: "0 to 2^Theta - 1, per band where band-varying." }
      # Entropy coders (user guide 2.4)
      - { name: UnaryLimit_g, label: Unary length limit (Umax), advanced: true, description: "Sample-adaptive and hybrid coder: the longest codeword has Umax + D bits." }
      - { name: RescaleCounterSize_g, label: Rescaling counter size (gamma*), advanced: true, description: max(4, gamma0 + 1) to 11. }
      - { name: InitialCountExp_g, label: Initial count exponent (gamma0), advanced: true, description: 1 to 8. }
      - { name: AccuInitBandVarying_g, label: Band-varying accumulator initialisation, advanced: true, description: "Sample-adaptive coder: one value k''z per band instead of the constant K." }
      - { name: AccuInitTable_g, label: Accumulator initialisation table, advanced: true, description: The values are written into the header (CCSDS 5.3.4.2). }
      - { name: AccuInit_g, label: Accumulator initialisation, advanced: true, description: "K (first element) or k''z per band, 0 to min(D - 2, 14)." }
      - { name: HybridAccuInit_g, label: Hybrid accumulators, advanced: true, description: "Hybrid coder: initial high-resolution accumulator per band, not in the header (CCSDS 5.4.3.3.4.3); the decompressor must know it." }
      - { name: HybridAccuInitHigh_g, label: Hybrid accumulators above 2^31, advanced: true, description: "Per band the part of the initial accumulator from 2^31 on." }
      - { name: BlockSize_g, label: Block size (J), unit: samples, choices: [8, 16, 32, 64], description: "Block-adaptive coder (CCSDS 5.4.3.4.2.4). Only that coder uses J, so the Composer offers only its values 8, 16, 32 and 64; with the other coders the core accepts any value." }
      - { name: RestrictedCodes_g, label: Restricted code options, advanced: true, description: "Block-adaptive coder, only with D <= 4." }
      - { name: RefInterval_g, label: Reference sample interval (r), advanced: true, description: "Block-adaptive coder: 1 to 4096 blocks." }
      # Image framing and implementation (user guide 2.5)
      - { name: UseInLast_g, label: Image framing with In_Last, description: "In_Last marks the last sample of every image: early and missing image ends are detected, flagged on Out_Error and Ev_ImageError, and the core resynchronises." }
      - { name: OutWidth_g, label: Output width, unit: bits, choices: [8, 16, 32, 64], description: Width of the compressed image stream. }
      - { name: Speculation_g, label: Speculative weight loop, advanced: true, description: "Speculative weight loop of the predictor where it applies: one sample per cycle in BSQ order and with M = 1 (user guide 8.1)." }
      - { name: RamStyle_g, label: RAM style, advanced: true, description: Implementation of the memories (Open Logic). }
    interfaces:
      - name: In
        label: Samples in
        type: c123.samples
        role: sink
        clock: Clk
        tieOff: zero
        needsLast: UseInLast_g
        description: "Samples in the input order of the encoding order; last on the last sample of every image (with UseInLast_g)."
        signals: { data: In_Data, valid: In_Valid, ready: In_Ready, last: In_Last }
      - name: Lim
        label: Error limits
        type: c123.limits
        role: sink
        clock: Clk
        enabledBy: PeriodicUpdate_g
        tieOff: default
        description: "At every frame y with y mod 2^u = 0, before its first sample: the absolute, then the relative limits (one value, or one per band), each a 16-bit value of which DA or DR bits are used."
        signals: { data: Lim_Data, valid: Lim_Valid, ready: Lim_Ready }
      - name: Out
        label: Compressed images
        type: byte.stream
        role: source
        clock: Clk
        mustServe: true
        description: "One packet per compressed image (header and body, a multiple of B bytes); error on the last beat of an image with a framing error (with UseInLast_g)."
        signals: { data: Out_Data, keep: Out_Keep, last: Out_Last, valid: Out_Valid, ready: Out_Ready, error: Out_Error }
      - { name: Ecc, label: EDAC events, type: ecc.event, role: event_out, clock: Clk, tieOff: open, description: "One pair for every memory of the core: corrected single error, detected double error.", memory: "memories of the predictor and the entropy coder (channels 0 to 13 of the error injection)", signals: { sec: Ecc_Sec, ded: Ecc_Ded } }
      - { name: ImageError, label: Image framing errors, type: sig.pulse, role: event_out, clock: Clk, tieOff: open, enabledBy: UseInLast_g, description: "One pulse for every image with a framing error, when it is detected at the input.", signals: { image_error: Ev_ImageError } }
      - { name: ErrInj, label: Error injection, type: ecc.inject, role: event_in, clock: Clk, tieOff: default, description: Tests only., signals: { channel: ErrInj_Channel, double: ErrInj_Double, valid: ErrInj_Valid } }
    # The configurations synthesised in user guide section 8.2 and verified against the CNES reference software
    # (tools/ocp_configs.py), with their compression generics only: the image size, the dynamic range and the output
    # width stay the user's. In BIP order the sub-frame depth follows the number of bands.
    presets:
      - id: lossless_bip
        name: Lossless BIP, sample-adaptive
        summary: "Lossless compression in BIP order (M = NZ) with full prediction and the sample-adaptive coder; configuration c01 of the user guide."
        generics: { SubFrameDepth_g: { sameAs: ZSize_g, why: BIP }, OutputWordSize_g: 4, RegisterSize_g: 32, UnaryLimit_g: 18, AccuInit_g: "(0 => 4)" }
      - id: lossless_bsq
        name: Lossless BSQ, speculative weight loop
        summary: "Lossless compression in BSQ order with reduced prediction, narrow local sums and the sample-adaptive coder; configuration c25 of the user guide."
        generics: { EncodingOrder_g: BSQ, SubFrameDepth_g: 1, OutputWordSize_g: 4, PredictionMode_g: REDUCED, LocalSum_g: NARROW_NEIGHBOR, RegisterSize_g: 48, WeightResolution_g: 19, UnaryLimit_g: 18, AccuInit_g: "(0 => 5)" }
      - id: near_lossless_bil
        name: Near-lossless BIL, hybrid
        summary: "Near-lossless compression with an absolute error limit in BIL order (M = 1), reduced prediction, narrow column-oriented local sums and the hybrid coder; configuration c26 of the user guide."
        generics: { SubFrameDepth_g: 1, OutputWordSize_g: 4, EntropyCoder_g: HYBRID, PredictionMode_g: REDUCED, LocalSum_g: NARROW_COLUMN, RegisterSize_g: 48, WeightResolution_g: 19, Fidelity_g: ABSOLUTE, AbsBitDepth_g: 10, AbsErrorLimits_g: "(0 => 12)", SampleRepResolution_g: 2, Damping_g: "(0 => 2)", Offset_g: "(0 => 1)", InitialCountExp_g: 2, HybridAccuInit_g: "(0 => 300)" }
      - id: lossless_bip_block
        name: Lossless BIP, block-adaptive
        summary: "Lossless compression in BIP order (M = NZ) with full prediction and the block-adaptive coder; configuration c27 of the user guide."
        generics: { SubFrameDepth_g: { sameAs: ZSize_g, why: BIP }, OutputWordSize_g: 4, EntropyCoder_g: BLOCK_ADAPTIVE, WeightResolution_g: 19, RefInterval_g: 32 }
      - id: near_lossless_bip
        name: Near-lossless BIP, stride order
        summary: "Near-lossless compression with an absolute error limit in BIP order (M = NZ), full prediction and the sample-adaptive coder; the predictor uses its stride order. Configuration c29 of the user guide."
        generics: { SubFrameDepth_g: { sameAs: ZSize_g, why: BIP }, OutputWordSize_g: 2, RegisterSize_g: 48, WeightResolution_g: 14, WeightUpdateInterval_g: 5, Fidelity_g: ABSOLUTE, AbsBitDepth_g: 4, AbsErrorLimits_g: "(0 => 2)", SampleRepResolution_g: 2, Damping_g: "(0 => 1)", Offset_g: "(0 => 2)" }
    # the ECC of the memories inside the core; it has no register map: the events leave at Ecc
    protection:
      evidence: "user guide section 6 (protection scope) and section 4.1 (memories and error injection)"
    rules:
      # hdl/ocp_predictor/src/ocp_predictor.vhd: images of width 1 need reduced prediction and column-oriented local sums
      - { kind: generic_range, generic: XSize_g, min: 2, when: { generic: PredictionMode_g, is: FULL }, message: "images of width 1 need reduced prediction and column-oriented local sums (CCSDS 4.3.1, 4.4.1)" }
      - { kind: generic_range, generic: XSize_g, min: 2, when: { generic: LocalSum_g, is: WIDE_NEIGHBOR }, message: "images of width 1 need reduced prediction and column-oriented local sums (CCSDS 4.3.1, 4.4.1)" }
      - { kind: generic_range, generic: XSize_g, min: 2, when: { generic: LocalSum_g, is: NARROW_NEIGHBOR }, message: "images of width 1 need reduced prediction and column-oriented local sums (CCSDS 4.3.1, 4.4.1)" }
      # hdl/ocp_predictor/src/ocp_predictor.vhd: the register size (CCSDS 4.7.2)
      - { kind: generic_range, generic: RegisterSize_g, min: "max(32, DynamicRange_g + WeightResolution_g + 2)", message: "CCSDS 4.7.2" }
      # hdl/ocp_predictor/src/ocp_predictor.vhd: vmin <= vmax (CCSDS 4.10.2)
      - { kind: generic_range, generic: WeightUpdateVmin_g, max: WeightUpdateVmax_g, message: "CCSDS 4.10.2" }
      # hdl/ocp_core/src/ocp_core.vhd: the parameter ranges of the standard that depend on other parameters; BlockSize_g
      # in {8, 16, 32, 64} is given by its choices
      - { kind: generic_range, generic: SubFrameDepth_g, max: ZSize_g, when: { generic: EncodingOrder_g, is: BI }, message: "the sub-frame depth M is 1 to NZ (CCSDS 5.4.2.2.1)" }
      - { kind: generic_range, generic: DynamicRange_g, max: 4, when: [RestrictedCodes_g, { generic: EntropyCoder_g, is: BLOCK_ADAPTIVE }], message: "the restricted code options need D <= 4 (CCSDS 5.3.4.4, 5.4.3.4.2.6)" }
      - { kind: generic_range, generic: RescaleCounterSize_g, min: "max(4, InitialCountExp_g + 1)", when: { generic: EntropyCoder_g, not: BLOCK_ADAPTIVE }, message: "CCSDS 5.4.3.2.3.4, 5.4.3.3.4.5" }
      - { kind: generic_range, generic: AccuInit_g, elements: "AccuInitBandVarying_g * (ZSize_g - 1) + 1", min: 0, max: "min(DynamicRange_g - 2, 14)", when: { generic: EntropyCoder_g, is: SAMPLE_ADAPTIVE }, message: "CCSDS 5.4.3.2.3.3" }
      # hdl/ocp_predictor/src/ocp_predictor.vhd: periodic error limit updating needs BI order in near-lossless compression
      - { kind: generic_requires, generic: PeriodicUpdate_g, value: true, requires: { EncodingOrder_g: BI }, when: { generic: Fidelity_g, not: LOSSLESS } }
      # the error flag of the compressed images (Out_Error) where the image framing reports framing errors
      - kind: flag_dropped
        interface: Out
        signal: error
        bit: 0
        when: UseInLast_g
        message: >-
          The error flag of the compressed images (Out_Error on the last word) is not passed on, so an image with a
          framing error is sent like a good one. Mark or discard such images by Out_Error, or count them at
          ImageError (Ev_ImageError).
    rates:
      evidence: "tools/ocp_throughput.py: the cycle in which the predictor takes every sample of a configuration (checked cycle by cycle by the predictor testbench: TC-PR-01 to TC-PR-37, PR-TP-01 to PR-TP-03) and image_period, the cycles between the first samples of consecutive images (TC-CO-50); tools/ocp_model.py: the header (compared with the CNES reference software for every configuration of the regression) and max_image_bytes, the upper bound on the compressed image (TC-CO-51: every compressed image of the regression and of the CCSDS test data set); user guide section 8.1; the bit packer outputs OutWidth_g bits per cycle (TC-CO-39 to TC-CO-41, TC-CO-45)"
      model: ocp
      packet: image
      assumed:
        name: ratio
        label: Assumed compression ratio
        description: "Bytes of the samples per byte of the compressed image, for the throughput budget and the packet sizes behind the core; empty: the upper bound on the compressed image that the core publishes. An assumption about the data, not a property of the core: the brief marks every number that depends on it."
      vars: { S: XSize_g * YSize_g * ZSize_g }
      interfaces:
        # an image of S samples of D bits, taken in ocp_cycles_per_image cycles in a stream of images (image_period)
        In: { cycles: "n * 8.0 * ocp_cycles_per_image / (DynamicRange_g * S)", reference: "cdiv(S * DynamicRange_g, 8)" }
        Out: { bytesPerBeat: OutWidth_g / 8 }
      routes:
        # the core counts the samples of an image: the stream of samples is cut into images, each leaves as one
        # compressed image of ocp_image_bytes (from the assumed ratio, else the upper bound; a multiple of B bytes)
        - { from: In, to: Out, chunk: "cdiv(S * DynamicRange_g, 8)", addBytes: "ocp_image_bytes - n" }
    sizes:
      evidence: "user guide sections 4 and 5: the core counts the NX NY NZ samples of an image and outputs every image as one packet (Out_Last on its last word)"
      interfaces:
        In: { noLimit: true }
    init:
      - { text: "None: the core starts from the initial state of the standard with every image; all parameters are generics." }
    notes:
      - Rst is synchronous and high-active; synchronise its release to Clk, for example with olo_base_reset_gen with SyncTmr_g = true. A reset aborts the image in progress.
      - Every image is compressed independently with the same parameters; the samples of the next image may follow the last sample of an image without a gap.
      - The decompressor must know the tables that are not in the header (table generics false) and the initial accumulators of the hybrid coder.
      - The hybrid coder is decoded from the end of the compressed image; keep Out_Last (the end of the packet) up to the decompressor.
      - After a detected double error (Ecc_Ded) the compressed image in progress may be wrong; discard it and reset the core before the next image.
      - With UseInLast_g, In_Last accompanies the last sample of every image; otherwise every image is flagged and the samples up to the next In_Last are discarded.
      - Enable the TMR of the synthesis tool for the core; it protects its memories itself and relies on TMR for all other logic (user guide section 6).
