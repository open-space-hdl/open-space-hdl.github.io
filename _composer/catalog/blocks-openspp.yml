# OpenSPP blocks. Ports and generics come from the VHDL entity at the pinned commit (sources.yml).

blocks:
  - id: openspp/spp_core
    kind: core
    name: Space Packet node
    group: openspp
    project: OpenSPP
    source: openspp
    entity: spp_core
    path: hdl/spp_core/src/spp_core.vhd
    packages: [hdl/spp_pkg/src/spp_pkg.vhd]
    idPrefix: spp
    doc: https://openspacehdl.org/openspp/docs/user_guide.html
    summary: >-
      Space Packet Protocol (CCSDS 133.0-B-2) with the CPTP layer of ECSS-E-ST-50-53C: send and receive ports with
      Octet String or Packet Service, APID routing and a register file.
    clocks:
      - { port: Clk, primary: true, label: Clock, description: All of the core; one beat per cycle on every path. }
    resets:
      - { port: Rst, active: high, sync: sync, clock: Clk }
    # follow.rank: when the generics at both ends of a connection follow each other, the lower rank follows the higher
    generics:
      - { name: DataWidth_g, label: Stream width, unit: bits, check: multiple8, description: Width of all streams; follows the connected packet link unless set by hand., follow: { interfaces: [S_Link, M_Link], measure: data, rank: 2 } }
      - { name: NumTx_g, label: Send ports, description: Number of send ports. }
      - { name: NumRx_g, label: Receive ports, description: Number of receive ports. }
      - { name: TxOctetString_g, label: Send port services, advanced: true, description: "Bit p for send port p: '1' Octet String Service, '0' Packet Service." }
      - { name: RxOctetString_g, label: Receive port services, advanced: true, description: "Bit p for receive port p: '1' Octet String Service, '0' Packet Service." }
      - { name: TxBufferBytes_g, label: Send buffer, unit: bytes, description: Buffer of each send port; holds the longest SDU of the port. DataWidth_g / 8 times a power of two. }
      - { name: TxMaxPackets_g, label: Send buffer SDUs, min: 2, description: SDUs a send buffer holds. }
      - { name: RxBufferBytes_g, label: Receive buffer, unit: bytes, description: Receive buffer shared by all receive ports; holds the longest Space Packet. DataWidth_g / 8 times a power of two. }
      - { name: RxMaxPackets_g, label: Receive buffer packets, min: 2, description: Packets the receive buffer holds. }
      - { name: Encapsulation_g, label: CPTP layer, description: CPTP layer of ECSS-E-ST-50-53C; false removes it. }
      - { name: NumDest_g, label: Destinations, enabledBy: Encapsulation_g, description: Destinations of the CPTP layer. }
      - { name: SpwAddrBytes_g, label: SpaceWire address bytes, advanced: true, enabledBy: Encapsulation_g, description: Maximum target SpaceWire address of a destination in bytes. }
      - { name: MaxLength_g, label: Maximum packet length, unit: bytes, advanced: true, description: Reset value of the maximum packet length. }
      - { name: RoundRobin_g, label: Round robin, advanced: true, description: "Reset value of the multiplexing scheme: '0' fixed priority (port 0 first), '1' round robin." }
      - { name: Tla_g, label: Target logical address, description: Reset value of the own target logical address of the receive filter. }
      - { name: TxPathDefault_g, label: Send paths enabled, description: Every APID has an enabled path to destination 0 after reset. A flight configuration enables the paths by software. }
      - { name: RxPathDefault_g, label: Receive paths enabled, description: Every APID has an enabled path to receive port 0 after reset. A flight configuration enables the paths by software. }
      - { name: ClkFreqHz_g, label: Clock frequency, unit: Hz, fromClock: Clk, advanced: true, description: Clock frequency for the scrubbers of the APID tables. }
    interfaces:
      - name: S_Tx
        label: Send port
        type: spp.tx
        role: sink
        clock: Clk
        vector: NumTx_g
        tieOff: zero
        signals: { data: S_Tx_Data, keep: S_Tx_Keep, last: S_Tx_Last, user: S_Tx_User, valid: S_Tx_Valid, ready: S_Tx_Ready }
        sideband:
          signal: user
          description: Parameters of the SDU, held constant during the SDU.
          fields:
            - { name: apid, label: APID, lsb: 0, bits: 11, kind: integer, default: 0 }
            - { name: shi, label: Secondary header flag, lsb: 11, bits: 1, kind: boolean, default: false }
            - { name: type, label: Packet type (telecommand), lsb: 12, bits: 1, kind: boolean, default: false }
            - { name: nameValid, label: Packet name instead of sequence count, lsb: 13, bits: 1, kind: boolean, default: false }
            - { name: name, label: Packet name, lsb: 14, bits: 14, kind: integer, default: 0, enabledBy: nameValid }
      - name: M_Rx
        label: Receive port
        type: spp.rx
        role: source
        clock: Clk
        vector: NumRx_g
        mustServe: true
        description: Must be served; all receive ports share one receive buffer.
        signals: { data: M_Rx_Data, keep: M_Rx_Keep, last: M_Rx_Last, user: M_Rx_User, valid: M_Rx_Valid, ready: M_Rx_Ready }
        userFields:
          - { name: apid, label: APID, lsb: 0, bits: 11 }
          - { name: shi, label: Secondary Header Indicator (Octet String Service), lsb: 11, bits: 1 }
          - { name: loss, label: Packet Loss or Data Loss Indicator, lsb: 12, bits: 1 }
          - { name: error, label: "Double bit error in the receive buffer during this SDU, valid with last", lsb: 13, bits: 1 }
          - { name: ua, label: User Application value of the CPTP packet (0 without the CPTP layer), lsb: 14, bits: 8 }
      - name: M_Link
        label: Link out
        type: pkt.link
        role: source
        clock: Clk
        mustServe: true
        description: "Transmitted packets; user bit 0 is the error end of packet, bits 4:1 the destination index."
        signals: { data: M_Link_Data, keep: M_Link_Keep, last: M_Link_Last, user: M_Link_User, valid: M_Link_Valid, ready: M_Link_Ready }
        userFields:
          - { name: eep, label: "Error end of packet (EEP), valid with last", lsb: 0, bits: 1 }
          - { name: dest, label: Destination index of the packet, lsb: 1, bits: 4 }
      - name: S_Link
        label: Link in
        type: pkt.link
        role: sink
        clock: Clk
        description: "Received packets; user bit 0 is the error end of packet."
        signals: { data: S_Link_Data, keep: S_Link_Keep, last: S_Link_Last, user: S_Link_User, valid: S_Link_Valid, ready: S_Link_Ready }
        userFields:
          - { name: eep, label: "Error end of packet (EEP), valid with last", lsb: 0, bits: 1 }
      - name: S_AxiLite
        label: Registers
        type: axi4lite
        role: slave
        clock: Clk
        prefix: S_AxiLite_
        params: { addrWidth: 11 }
      - name: Irq
        label: Interrupt
        type: irq
        role: event_out
        clock: Clk
        tieOff: open
        signals: { irq: Irq }
      - name: Err
        label: Errors
        type: spp.err
        role: event_out
        clock: Clk
        tieOff: open
        signals: { valid: Err_Valid, code: Err_Code, port: Err_Port, apid: Err_Apid }
    rules:
      # spp_header_insert.vhd, spp_header_remove.vhd and the width converters: whole bytes
      - { kind: generic_multiple, generic: DataWidth_g, of: 8 }
      - { kind: generic_multiple, generic: TxBufferBytes_g, of: DataWidth_g / 8, pow2Ratio: true }
      - { kind: generic_multiple, generic: RxBufferBytes_g, of: DataWidth_g / 8, pow2Ratio: true }
    idRegister: { address: "0x000", value: "0x53505001" }
    registers: { map: hdl/spp_mib/regs/spp_regs.yml, header: sw/spp_regs.h, doc: hdl/spp_mib/docs/register_map.md, prefix: SPP }
    init:
      - { text: "After the reset wait until TABLE_STATUS (0x040) bits 1:0 (TX_BUSY, RX_BUSY) are 0: the core initialises both APID tables (2048 clock cycles)." }
      - { text: "Nothing else is needed: with TxPathDefault_g and RxPathDefault_g every APID has an enabled path to destination 0 and to receive port 0, destination 0 has the Target Logical Address 0xFE (DEST_CTRL 0x400) and the own address is Tla_g. A flight configuration writes the APID tables (TX_TABLE_APID 0x030 and TX_TABLE_ENTRY 0x034, RX_TABLE_APID 0x038 and RX_TABLE_ENTRY 0x03C) and the destinations (DEST_CTRL 0x400 + 0x20 n).", when: [TxPathDefault_g, RxPathDefault_g] }
      - { text: "Enable the managed data paths: for every APID write TX_TABLE_APID (0x030), read TX_TABLE_ENTRY (0x034), write it with ENABLE and DEST, read it again; the same with RX_TABLE_APID (0x038) and RX_TABLE_ENTRY (0x03C) with ENABLE and PORT; write the destinations (DEST_CTRL 0x400 + 0x20 n).", unlessAll: [TxPathDefault_g, RxPathDefault_g] }
    endToEnd: "Send one SDU on a send port (APID 0x123, for example) and expect it on receive port 0 with the same APID in user bits 10:0, once the APID tables are ready."
    notes:
      - Rst is synchronous and high-active; synchronise its release to Clk, for example with olo_base_reset_gen.
      - After the reset the core initialises both APID tables (2048 clock cycles); packets are sent and delivered once the tables are ready.
      - Serve every receive port, or place a buffer behind a port whose user can stall for long.
      - TxBufferBytes_g holds the longest SDU of a port, RxBufferBytes_g the longest Space Packet.
      - Hold the side band (TUser) of a send port constant during an SDU.
      - A last beat without valid bytes (Keep all zero) ends an SDU or packet at the inputs; an SDU without any byte is rejected (0x02). The outputs never carry a beat without valid bytes.
      - The user supplies the packet secondary header at the start of the Octet String and keeps the secondary header flag of an APID static.
    rates:
      evidence: "user guide section 7; TC-CO-12 (throughput at 32, 64 and 128 bit), TC-CO-08, TC-SE-10"
      packet: SDU
      # H: bytes a send port adds to an SDU: the Space Packet header of the Octet String Service (assumed at every
      # port, the longer case) and the CPTP header with the longest target address
      vars: { B: DataWidth_g / 8, H: "6 + Encapsulation_g * (4 + SpwAddrBytes_g)" }
      interfaces:
        S_Tx: { bytesPerBeat: B }
        M_Link: { cycles: "max(cdiv(n, B) + 1, 5)" }                         # all send ports together
        S_Link: { bytesPerBeat: B, overheadCycles: "1" }
        M_Rx: { cycles: "max(cdiv(n + 6, B) + 1, 5)" }                       # all receive ports together
      routes:
        - { from: S_Tx, to: M_Link, addBytes: H }
        - { from: S_Link, to: M_Rx, addBytes: "-H" }
    sizes:
      evidence: "user guide section 7.1 and the integration table (the send buffer holds the longest SDU of a port, the receive buffer the longest Space Packet), requirements SPP-6 and SPP-23"
      interfaces:
        S_Tx:
          limits:
            - { maxBytes: TxBufferBytes_g, over: rejected, why: "the send buffer holds the longest SDU of the port (error code 0x01)" }
            - { maxBytes: 65536, over: rejected, why: "an Octet String has at most 65536 bytes (SPP-6)" }
        # a link packet: the Space Packet behind the 4 bytes of the CPTP header (target address bytes assumed stripped)
        S_Link:
          limits:
            - { maxBytes: "RxBufferBytes_g + 4 * Encapsulation_g", set: RxBufferBytes_g, over: discarded, why: "the receive buffer holds the longest Space Packet (error code 0x17)" }
            - { maxBytes: "65542 + 4 * Encapsulation_g", over: discarded, why: "a Space Packet has at most 65542 bytes (SPP-23)" }
            - { maxBytes: "MaxLength_g + 4 * Encapsulation_g", over: discarded, soft: { generic: MaxLength_g, register: MAX_LENGTH, hard: "min(RxBufferBytes_g, 65542)" }, why: "the Maximum Packet Length, MaxLength_g as the reset value of MAX_LENGTH" }
      sends:
        - { interface: M_Link, what: Space Packets, bytes: "n - Encapsulation_g * (4 + SpwAddrBytes_g)", farEnd: RxBufferBytes_g }

  - id: openspp/spp_nchar
    kind: module
    name: N-Char adapter
    group: openspp
    project: OpenSPP
    source: openspp
    entity: spp_nchar
    path: hdl/spp_nchar/src/spp_nchar.vhd
    packages: [hdl/spp_pkg/src/spp_pkg.vhd]
    idPrefix: nchar
    doc: https://openspacehdl.org/openspp/docs/user_guide.html
    summary: >-
      Converts a packet link stream to the N-Char stream of a SpaceWire port (one character per beat, end of packet
      marker beat) and back.
    clocks:
      - { port: Clk, primary: true, label: Clock }
    resets:
      - { port: Rst, active: high, sync: sync, clock: Clk }
    generics:
      - { name: DataWidth_g, label: Link width, unit: bits, check: multiple8, description: Width of the link streams; follows the connected link., follow: { interfaces: [S_Link, M_Link], measure: data, rank: 1 } }
    rules:
      # spp_header_insert.vhd, spp_header_remove.vhd and the width converters: whole bytes
      - { kind: generic_multiple, generic: DataWidth_g, of: 8 }
    interfaces:
      - name: S_Link
        label: Link in
        type: pkt.link
        role: sink
        clock: Clk
        signals: { data: S_Link_Data, keep: S_Link_Keep, last: S_Link_Last, user: S_Link_User, valid: S_Link_Valid, ready: S_Link_Ready }
        userFields:
          - { name: eep, label: "Error end of packet (EEP), valid with last", lsb: 0, bits: 1 }
          - { name: dest, label: Destination index (not used by the adapter), lsb: 1, bits: 4 }
      - name: M_NChar
        label: N-Chars out
        type: spw.nchar
        role: source
        clock: Clk
        signals: { data: M_NChar_Data, last: M_NChar_Last, valid: M_NChar_Valid, ready: M_NChar_Ready }
      - name: S_NChar
        label: N-Chars in
        type: spw.nchar
        role: sink
        clock: Clk
        signals: { data: S_NChar_Data, last: S_NChar_Last, valid: S_NChar_Valid, ready: S_NChar_Ready }
      - name: M_Link
        label: Link out
        type: pkt.link
        role: source
        clock: Clk
        signals: { data: M_Link_Data, keep: M_Link_Keep, last: M_Link_Last, user: M_Link_User, valid: M_Link_Valid, ready: M_Link_Ready }
        userFields:
          - { name: eep, label: "Error end of packet (EEP), valid with last", lsb: 0, bits: 1 }
    notes:
      - A received end of packet marker without data characters is discarded.
      - A link packet that ends with a beat without valid bytes gets its marker after the bytes of the earlier beats; a link packet without any byte sends nothing.
    rates:
      evidence: "user guide section 7.5; TC-AD-03 (1731 characters in 1780 cycles at 128 bit, 1638 in 1638 at 8 bit)"
      packet: packet
      interfaces:
        S_Link: { cycles: "n + 1 + min(1, DataWidth_g / 16)" }               # n + 2 cycles, n + 1 at 8 bit
        M_NChar: { cycles: "n + 1 + min(1, DataWidth_g / 16)" }
        S_NChar: { bytesPerBeat: 1, extraBeats: 1 }
      routes:
        - { from: S_Link, to: M_NChar, addBytes: "0" }
        # one N-Char per cycle in; the words of M_Link carry at least one byte each, so M_Link never limits more
        - { from: S_NChar, to: M_Link, addBytes: "0", paced: true }
