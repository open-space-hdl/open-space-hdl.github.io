# OpenSPP blocks. Ports and generics come from the VHDL entity at the pinned commit (sources.yml).

blocks:
  - id: openspp/spp_core
    kind: core
    name: Space Packet node
    group: openspp
    project: OpenSPP
    source: openspp
    entity: spp_core
    path: hdl/spp_core/src/spp_core.vhd
    packages: [hdl/spp_pkg/src/spp_pkg.vhd]
    idPrefix: spp
    doc: /openspp/docs/user_guide.html
    summary: >-
      Space Packet Protocol (CCSDS 133.0-B-2) with the CPTP layer of ECSS-E-ST-50-53C: send and receive ports with
      Octet String or Packet Service, APID routing and a register file.
    clocks:
      - { port: Clk, primary: true, label: Clock, description: All of the core; one beat per cycle on every path. }
    resets:
      - { port: Rst, active: high, sync: sync, clock: Clk }
      # the data path reset for a reset group of the system (user guide 3.1); outside a group it keeps its default
      - { port: DpRst, active: high, sync: sync, clock: Clk, group: true, description: "Data path reset: every function except the link output stage, which ends a packet open on M_Link with an EEP beat." }
    # follow.rank: when the generics at both ends of a connection follow each other, the lower rank follows the higher
    generics:
      - { name: DataWidth_g, label: Stream width, unit: bits, check: multiple8, description: Width of all streams; follows the connected packet link unless set by hand., follow: { interfaces: [S_Link, M_Link], measure: data, rank: 2 } }
      - { name: NumTx_g, label: Send ports, description: Number of send ports. }
      - { name: NumRx_g, label: Receive ports, description: Number of receive ports. }
      - { name: TxOctetString_g, label: Send port services, advanced: true, description: "Bit p for send port p: '1' Octet String Service, '0' Packet Service." }
      - { name: RxOctetString_g, label: Receive port services, advanced: true, description: "Bit p for receive port p: '1' Octet String Service, '0' Packet Service." }
      - { name: TxBufferBytes_g, label: Send buffer, unit: bytes, description: Buffer of each send port; holds the longest SDU of the port. DataWidth_g / 8 times a power of two. }
      - { name: TxMaxPackets_g, label: Send buffer SDUs, min: 2, description: SDUs a send buffer holds. }
      - { name: RxBufferBytes_g, label: Receive buffer, unit: bytes, description: Receive buffer shared by all receive ports; holds the longest Space Packet. DataWidth_g / 8 times a power of two. }
      - { name: RxMaxPackets_g, label: Receive buffer packets, min: 2, description: Packets the receive buffer holds. }
      - { name: Encapsulation_g, label: CPTP layer, description: CPTP layer of ECSS-E-ST-50-53C; false removes it. }
      - { name: NumDest_g, label: Destinations, enabledBy: Encapsulation_g, description: Destinations of the CPTP layer. }
      - { name: SpwAddrBytes_g, label: SpaceWire address bytes, advanced: true, enabledBy: Encapsulation_g, description: Maximum target SpaceWire address of a destination in bytes. }
      - { name: MaxLength_g, label: Maximum packet length, unit: bytes, advanced: true, description: Reset value of the maximum packet length. }
      - { name: RoundRobin_g, label: Round robin, advanced: true, description: "Reset value of the multiplexing scheme: '0' fixed priority (port 0 first), '1' round robin." }
      - { name: Tla_g, label: Target logical address, description: Reset value of the own target logical address of the receive filter. }
      - { name: TxPathDefault_g, label: Send paths enabled, description: Every APID has an enabled path to destination 0 after reset. A flight configuration enables the paths by software. }
      - { name: RxPathDefault_g, label: Receive paths enabled, description: Every APID has an enabled path to receive port 0 after reset. A flight configuration enables the paths by software. }
      - { name: ClkFreqHz_g, label: Clock frequency, unit: Hz, fromClock: Clk, advanced: true, description: Clock frequency for the scrubbers of the APID tables. }
    interfaces:
      - name: S_Tx
        label: Send port
        type: spp.tx
        role: sink
        clock: Clk
        resetBy: DpRst
        vector: NumTx_g
        tieOff: zero
        signals: { data: S_Tx_Data, keep: S_Tx_Keep, last: S_Tx_Last, user: S_Tx_User, valid: S_Tx_Valid, ready: S_Tx_Ready }
        sideband:
          signal: user
          description: Parameters of the SDU, held constant during the SDU.
          fields:
            - { name: apid, label: APID, lsb: 0, bits: 11, kind: integer, default: 0 }
            - { name: shi, label: Secondary header flag, lsb: 11, bits: 1, kind: boolean, default: false }
            - { name: type, label: Packet type (telecommand), lsb: 12, bits: 1, kind: boolean, default: false }
            - { name: nameValid, label: Packet name instead of sequence count, lsb: 13, bits: 1, kind: boolean, default: false }
            - { name: name, label: Packet name, lsb: 14, bits: 14, kind: integer, default: 0, enabledBy: nameValid }
      - name: M_Rx
        label: Receive port
        type: spp.rx
        role: source
        clock: Clk
        resetBy: DpRst
        vector: NumRx_g
        mustServe: true
        description: Must be served; all receive ports share one receive buffer.
        signals: { data: M_Rx_Data, keep: M_Rx_Keep, last: M_Rx_Last, user: M_Rx_User, valid: M_Rx_Valid, ready: M_Rx_Ready }
        userFields:
          - { name: apid, label: APID, lsb: 0, bits: 11 }
          - { name: shi, label: Secondary Header Indicator (Octet String Service), lsb: 11, bits: 1 }
          - { name: loss, label: Packet Loss or Data Loss Indicator, lsb: 12, bits: 1 }
          - { name: error, label: "Double bit error in the receive buffer during this SDU, valid with last", lsb: 13, bits: 1 }
          - { name: ua, label: User Application value of the CPTP packet (0 without the CPTP layer), lsb: 14, bits: 8 }
      - name: M_Link
        label: Link out
        type: pkt.link
        role: source
        clock: Clk
        # reset by Rst only (CO-RS-12): the border of a group of DpRst; the warning on a member at its far end quotes this
        resetBorder: "reset the link side (spp_nchar, the SpaceWire or SpaceFibre port) with the reset of the link, never with DpRst, so that the EEP that ends an interrupted packet reaches the far end (OpenSPP user guide 3.1)."
        mustServe: true
        description: "Transmitted packets; user bit 0 is the error end of packet, bits 4:1 the destination index."
        signals: { data: M_Link_Data, keep: M_Link_Keep, last: M_Link_Last, user: M_Link_User, valid: M_Link_Valid, ready: M_Link_Ready }
        userFields:
          - { name: eep, label: "Error end of packet (EEP), valid with last", lsb: 0, bits: 1 }
          - { name: dest, label: Destination index of the packet, lsb: 1, bits: 4 }
      - name: S_Link
        label: Link in
        type: pkt.link
        role: sink
        clock: Clk
        resetBy: DpRst
        description: "Received packets; user bit 0 is the error end of packet."
        signals: { data: S_Link_Data, keep: S_Link_Keep, last: S_Link_Last, user: S_Link_User, valid: S_Link_Valid, ready: S_Link_Ready }
        userFields:
          - { name: eep, label: "Error end of packet (EEP), valid with last", lsb: 0, bits: 1 }
      - name: S_AxiLite
        label: Registers
        type: axi4lite
        role: slave
        clock: Clk
        resetBy: DpRst
        prefix: S_AxiLite_
        params: { addrWidth: 11 }
      - name: Irq
        label: Interrupt
        type: irq
        role: event_out
        clock: Clk
        resetBy: DpRst
        tieOff: open
        signals: { irq: Irq }
        # the registers of the interrupt in the register map of the block (the brief gives their offsets)
        irqRegisters: { events: EVENTS, enable: [IRQ_EN], status: IRQ_STATUS }
      - name: Err
        label: Errors
        type: spp.err
        role: event_out
        clock: Clk
        resetBy: DpRst
        tieOff: open
        signals: { valid: Err_Valid, code: Err_Code, port: Err_Port, apid: Err_Apid }
    rules:
      # spp_header_insert.vhd, spp_header_remove.vhd and the width converters: whole bytes
      - { kind: generic_multiple, generic: DataWidth_g, of: 8 }
      - { kind: generic_multiple, generic: TxBufferBytes_g, of: DataWidth_g / 8, pow2Ratio: true }
      - { kind: generic_multiple, generic: RxBufferBytes_g, of: DataWidth_g / 8, pow2Ratio: true }
      # hdl/spp_core/src/spp_core.vhd: the buffers hold the shortest Space Packet (7 bytes, at least the two entries of
      # the packet FIFO) and at most what their packets of 65542 bytes ever write, within the 2^29 beats of Open Logic
      - { kind: generic_range, generic: TxBufferBytes_g, min: "DataWidth_g / 8 * max(2, 2 ** log2ceil(cdiv(7, DataWidth_g / 8)))", max: "DataWidth_g / 8 * min(2 ** log2ceil(TxMaxPackets_g * cdiv(65542, DataWidth_g / 8)), 2 ** 29)", message: "CO-GN-02, CO-GN-03" }
      - { kind: generic_range, generic: RxBufferBytes_g, min: "DataWidth_g / 8 * max(2, 2 ** log2ceil(cdiv(7, DataWidth_g / 8)))", max: "DataWidth_g / 8 * min(2 ** log2ceil(RxMaxPackets_g * cdiv(65542, DataWidth_g / 8)), 2 ** 29)", message: "CO-GN-02, CO-GN-03" }
      - { kind: generic_range, generic: TxMaxPackets_g, min: 2, max: "max(2, TxBufferBytes_g / (DataWidth_g / 8))", message: "an SDU of one byte takes a beat of the send buffer (CO-GN-04)" }
      - { kind: generic_range, generic: RxMaxPackets_g, min: 2, max: "max(2, RxBufferBytes_g / (DataWidth_g / 8) / cdiv(7, DataWidth_g / 8))", message: "the shortest Space Packets that fit into the receive buffer (CO-GN-04)" }
    idRegister: { address: "0x000", value: "0x53505001" }
    registers: { map: hdl/spp_mib/regs/spp_regs.yml, header: sw/spp_regs.h, doc: hdl/spp_mib/docs/register_map.md, prefix: SPP }
    # the ECC of the memories inside the core: double-error flags per channel, counters, error injection
    protection:
      evidence: "user guide section 6 (protection scope) and the register map"
      ecc: { status: ECC_STATUS, select: ECC_SELECT, count: ECC_COUNT, inject: ECC_INJECT }
    init:
      - { text: "After the reset wait until TABLE_STATUS (0x040) bits 1:0 (TX_BUSY, RX_BUSY) are 0: the core initialises both APID tables (2048 clock cycles)." }
      - { text: "Nothing else is needed: with TxPathDefault_g and RxPathDefault_g every APID has an enabled path to destination 0 and to receive port 0, destination 0 has the Target Logical Address 0xFE (DEST_CTRL 0x400) and the own address is Tla_g. A flight configuration writes the APID tables (TX_TABLE_APID 0x030 and TX_TABLE_ENTRY 0x034, RX_TABLE_APID 0x038 and RX_TABLE_ENTRY 0x03C) and the destinations (DEST_CTRL 0x400 + 0x20 n).", when: [TxPathDefault_g, RxPathDefault_g] }
      - { text: "Enable the managed data paths: for every APID write TX_TABLE_APID (0x030), read TX_TABLE_ENTRY (0x034), write it with ENABLE and DEST, read it again; the same with RX_TABLE_APID (0x038) and RX_TABLE_ENTRY (0x03C) with ENABLE and PORT; write the destinations (DEST_CTRL 0x400 + 0x20 n).", unlessAll: [TxPathDefault_g, RxPathDefault_g] }
    endToEnd: "Send one SDU on a send port (APID 0x123, for example) and expect it on receive port 0 with the same APID in user bits 10:0, once the APID tables are ready."
    notes:
      - Rst is synchronous and high-active; synchronise its release to Clk, for example with olo_base_reset_gen.
      - "DpRst restarts the core while the link stays in operation: it resets every function except the link output stage, which ends a packet open on M_Link with an EEP beat. It takes the reset of a reset group of the system and keeps its default '0' outside one. M_Link is reset by Rst only, so the link side (spp_nchar, the SpaceWire or SpaceFibre port) stays out of the group (user guide 3.1)."
      - "M_Link is driven by the register stage spp_link_output, which adds one clock cycle of latency (since OpenSPP 0.2.0) and no cycle per packet: the throughput and the clock cycles per packet are unchanged."
      - After the reset the core initialises both APID tables (2048 clock cycles); packets are sent and delivered once the tables are ready.
      - Serve every receive port, or place a buffer behind a port whose user can stall for long.
      - TxBufferBytes_g holds the longest SDU of a port, RxBufferBytes_g the longest Space Packet.
      - Hold the side band (TUser) of a send port constant during an SDU.
      - A last beat without valid bytes (Keep all zero) ends an SDU or packet at the inputs; an SDU without any byte is rejected (0x02). The outputs never carry a beat without valid bytes.
      - The user supplies the packet secondary header at the start of the Octet String and keeps the secondary header flag of an APID static.
    rates:
      evidence: "user guide section 7 (7.3: all receive ports share one buffer and get their packets in the order of arrival); TC-CO-12 (throughput at 32, 64 and 128 bit), TC-CO-08, TC-SE-10"
      packet: SDU
      # H: bytes a send port adds to an SDU: the Space Packet header of the Octet String Service (assumed at every
      # port, the longer case) and the CPTP header with the longest target address
      vars: { B: DataWidth_g / 8, H: "6 + Encapsulation_g * (4 + SpwAddrBytes_g)" }
      interfaces:
        S_Tx: { bytesPerBeat: B }
        M_Link: { cycles: "max(cdiv(n, B) + 1, 5)" }                         # all send ports together
        S_Link: { bytesPerBeat: B, overheadCycles: "1" }
        M_Rx: { cycles: "max(cdiv(n + 6, B) + 1, 5)" }                       # all receive ports together
      routes:
        - { from: S_Tx, to: M_Link, addBytes: H }
        # one receive buffer for all receive ports: a packet holds the delivery until its port has taken it
        - { from: S_Link, to: M_Rx, addBytes: "-H", inOrder: true }
    sizes:
      evidence: "user guide section 7.1 and the integration table (the send buffer holds the longest SDU of a port, the receive buffer the longest Space Packet), requirements SPP-6 and SPP-23"
      interfaces:
        S_Tx:
          limits:
            - { maxBytes: TxBufferBytes_g, over: rejected, why: "the send buffer holds the longest SDU of the port (error code 0x01)" }
            - { maxBytes: 65536, over: rejected, why: "an Octet String has at most 65536 bytes (SPP-6)" }
        # a link packet: the Space Packet behind the 4 bytes of the CPTP header (target address bytes assumed stripped)
        S_Link:
          limits:
            - { maxBytes: "RxBufferBytes_g + 4 * Encapsulation_g", set: RxBufferBytes_g, over: discarded, why: "the receive buffer holds the longest Space Packet (error code 0x17)" }
            - { maxBytes: "65542 + 4 * Encapsulation_g", over: discarded, why: "a Space Packet has at most 65542 bytes (SPP-23)" }
            - { maxBytes: "MaxLength_g + 4 * Encapsulation_g", over: discarded, soft: { generic: MaxLength_g, register: MAX_LENGTH, hard: "min(RxBufferBytes_g, 65542)" }, why: "the Maximum Packet Length, MaxLength_g as the reset value of MAX_LENGTH" }
      sends:
        - { interface: M_Link, what: Space Packets, bytes: "n - Encapsulation_g * (4 + SpwAddrBytes_g)", farEnd: RxBufferBytes_g }

  - id: openspp/spp_nchar
    kind: module
    name: N-Char adapter
    group: openspp
    project: OpenSPP
    source: openspp
    entity: spp_nchar
    path: hdl/spp_nchar/src/spp_nchar.vhd
    packages: [hdl/spp_pkg/src/spp_pkg.vhd]
    idPrefix: nchar
    doc: /openspp/docs/user_guide.html
    summary: >-
      Converts a packet link stream to the N-Char stream of a SpaceWire port (one character per beat, end of packet
      marker beat) and back.
    clocks:
      - { port: Clk, primary: true, label: Clock }
    resets:
      - { port: Rst, active: high, sync: sync, clock: Clk }
    generics:
      - { name: DataWidth_g, label: Link width, unit: bits, check: multiple8, description: Width of the link streams; follows the connected link., follow: { interfaces: [S_Link, M_Link], measure: data, rank: 1 } }
    rules:
      # spp_header_insert.vhd, spp_header_remove.vhd and the width converters: whole bytes
      - { kind: generic_multiple, generic: DataWidth_g, of: 8 }
    interfaces:
      - name: S_Link
        label: Link in
        type: pkt.link
        role: sink
        clock: Clk
        signals: { data: S_Link_Data, keep: S_Link_Keep, last: S_Link_Last, user: S_Link_User, valid: S_Link_Valid, ready: S_Link_Ready }
        userFields:
          - { name: eep, label: "Error end of packet (EEP), valid with last", lsb: 0, bits: 1 }
          - { name: dest, label: Destination index (not used by the adapter), lsb: 1, bits: 4 }
      - name: M_NChar
        label: N-Chars out
        type: spw.nchar
        role: source
        clock: Clk
        signals: { data: M_NChar_Data, last: M_NChar_Last, valid: M_NChar_Valid, ready: M_NChar_Ready }
      - name: S_NChar
        label: N-Chars in
        type: spw.nchar
        role: sink
        clock: Clk
        signals: { data: S_NChar_Data, last: S_NChar_Last, valid: S_NChar_Valid, ready: S_NChar_Ready }
      - name: M_Link
        label: Link out
        type: pkt.link
        role: source
        clock: Clk
        signals: { data: M_Link_Data, keep: M_Link_Keep, last: M_Link_Last, user: M_Link_User, valid: M_Link_Valid, ready: M_Link_Ready }
        userFields:
          - { name: eep, label: "Error end of packet (EEP), valid with last", lsb: 0, bits: 1 }
    notes:
      - A received end of packet marker without data characters is discarded.
      - A link packet that ends with a beat without valid bytes gets its marker after the bytes of the earlier beats; a link packet without any byte sends nothing.
    rates:
      evidence: "user guide section 7.5; TC-AD-03 (1731 characters in 1780 cycles at 128 bit, 1638 in 1638 at 8 bit)"
      packet: packet
      interfaces:
        S_Link: { cycles: "n + 1 + min(1, DataWidth_g / 16)" }               # n + 2 cycles, n + 1 at 8 bit
        M_NChar: { cycles: "n + 1 + min(1, DataWidth_g / 16)" }
        S_NChar: { bytesPerBeat: 1, extraBeats: 1 }
      routes:
        - { from: S_Link, to: M_NChar, addBytes: "0" }
        # one N-Char per cycle in; the words of M_Link carry at least one byte each, so M_Link never limits more
        - { from: S_NChar, to: M_Link, addBytes: "0", paced: true }

  - id: openspp/spp_packetizer
    kind: module
    name: Packetizer
    group: openspp
    project: OpenSPP
    source: openspp
    entity: spp_packetizer
    path: hdl/spp_packetizer/src/spp_packetizer.vhd
    packages: [hdl/spp_pkg/src/spp_pkg.vhd]
    idPrefix: ptz
    doc: /openspp/docs/user_guide.html
    summary: >-
      Cuts data units of any length into segments of ChunkBytes_g bytes and sends every segment as one Space Packet,
      with the Sequence Flags of its segment and the Packet Sequence Count of the instance, to a send port of the Packet
      Service; optional Packet Secondary Header and CRC.
    clocks:
      - { port: Clk, primary: true, label: Clock, description: The clock of the core. }
    resets:
      - { port: Rst, active: high, sync: sync, clock: Clk }
    generics:
      - { name: DataWidth_g, label: Stream width, unit: bits, check: multiple8, description: The DataWidth_g of the core; follows the connected send port., follow: { interfaces: [M, S], measure: data, rank: 1 } }
      - { name: ChunkBytes_g, label: Segment size, unit: bytes, description: "Bytes of a segment, a multiple of DataWidth_g / 8; the last segment of a data unit holds the rest. A packet has 6 + SecHdrBytes_g + ChunkBytes_g bytes, plus 2 with Crc_g." }
      - { name: BufferBytes_g, label: Segment buffer, unit: bytes, description: "DataWidth_g / 8 times a power of two, at least ChunkBytes_g. At twice ChunkBytes_g the next segment enters while a packet leaves; at ChunkBytes_g the input waits while every packet leaves." }
      - { name: MaxChunks_g, label: Buffered segments, description: Segments the buffer holds at most (short data units). }
      - { name: SecHdrBytes_g, label: Secondary header, unit: bytes, description: Bytes of the Packet Secondary Header from SecHdr_Data; 0 for none. }
      - { name: Crc_g, label: CRC, description: "CRC of two bytes at the end of every User Data Field, over the bytes of the segment (x^16 + x^12 + x^5 + 1, initial value all ones, ECSS-E-ST-70-41C Annex B.1)." }
    interfaces:
      - name: S
        label: Data units in
        type: byte.stream
        role: sink
        clock: Clk
        tieOff: zero
        description: "Data units of any length; a last beat without byte enables ends a data unit, a data unit without any byte sends nothing. Error with the last beat marks an aborted data unit, which is sent and closed like any other (Aborted)."
        signals: { data: S_Data, keep: S_Keep, last: S_Last, valid: S_Valid, ready: S_Ready, error: S_Error }
      - name: M
        label: Space Packets out
        type: byte.stream
        role: source
        clock: Clk
        mustServe: true
        description: "One complete Space Packet per segment, to a send port of the core with the Packet Service (TxOctetString_g bit '0'), whose side band it does not use."
        signals: { data: M_Data, keep: M_Keep, last: M_Last, valid: M_Valid, ready: M_Ready }
      - name: Apid
        label: APID
        type: sig.control
        role: event_in
        clock: Clk
        tieOff: constant
        description: "APID of the packets, sampled per packet (HdrSample); it changes only while the packetizer holds no data."
        signals: { apid: Cfg_Apid }
        sideband:
          signal: apid
          description: Static APID of the packets, set as a constant of the instance; not the Idle APID 2047.
          fields:
            - { name: apid, label: APID, lsb: 0, bits: 11, kind: integer, default: 0 }
      - name: Type
        label: Packet type
        type: sig.control
        role: event_in
        clock: Clk
        tieOff: default
        description: "Packet Type of the packets: '0' telemetry (the default), '1' telecommand; sampled per packet like the APID."
        signals: { type: Cfg_Type }
      - name: SecHdr
        label: Secondary header
        type: sig.control
        role: event_in
        clock: Clk
        tieOff: default
        description: "Packet Secondary Header of SecHdrBytes_g bytes, bits 7:0 its first byte (a time code sent as T0 T1 T2 T3 is applied as T3 & T2 & T1 & T0); sampled per packet at HdrSample, so a time code there gives the time of that clock edge."
        signals: { data: SecHdr_Data }
      - { name: HdrSample, label: Header sampled, type: sig.pulse, role: event_out, clock: Clk, tieOff: open, description: "'1' for one clock cycle per packet: Cfg_Apid, Cfg_Type and SecHdr_Data are sampled at the rising edge of Clk that ends this cycle; the first beat of the packet follows at least two cycles later.", signals: { sample: Hdr_Sample } }
      - { name: Aborted, label: Aborted data units, type: sig.pulse, role: event_out, clock: Clk, tieOff: open, description: One pulse per accepted last beat with error; count it to report the aborted data units., signals: { aborted: Aborted } }
      - { name: Ecc, label: EDAC events, type: ecc.event, role: event_out, clock: Clk, vector: "2", tieOff: open, flavor: pulse, description: "Element 0 the segment buffer, element 1 the descriptors. A packet with a double error is still sent; the CRC (Crc_g) lets the receiver detect it.", memory: [segment buffer, descriptors], signals: { sec: Ecc_Sec, ded: Ecc_Ded } }
      - { name: ErrInj, label: Error injection, type: ecc.inject, role: event_in, clock: Clk, tieOff: default, description: Tests only., signals: { data: ErrInj_Data, desc: ErrInj_Desc, double: ErrInj_Double } }
    rules:
      # hdl/spp_packetizer/src/spp_packetizer.vhd (the assertions of the entity; specification section 3)
      - { kind: generic_multiple, generic: DataWidth_g, of: 8 }
      - { kind: generic_range, generic: DataWidth_g, min: 8, max: 128 }
      - { kind: generic_multiple, generic: ChunkBytes_g, of: DataWidth_g / 8 }
      - { kind: generic_range, generic: ChunkBytes_g, max: "65536 - SecHdrBytes_g - 2 * Crc_g", message: "the longest Packet Data Field, 65536 bytes with the secondary header and the CRC (SPP 4.1.2.1)" }
      - { kind: generic_multiple, generic: BufferBytes_g, of: DataWidth_g / 8, pow2Ratio: true }
      - { kind: generic_range, generic: BufferBytes_g, min: ChunkBytes_g, message: the buffer holds a segment }
      - { kind: generic_range, generic: MaxChunks_g, min: 2, max: 64 }
      - { kind: generic_range, generic: SecHdrBytes_g, min: 0, max: 64 }
    endToEnd: "Send one data unit of 3 * ChunkBytes_g bytes and expect three Space Packets of its APID with the Sequence Flags '01', '00' and '10' at a receive port of the Packet Service."
    notes:
      - Connect M to a send port of the core with the Packet Service (TxOctetString_g bit '0'), and receive its APID at receive ports of the Packet Service; the Octet String Service never carries the Sequence Flags '01', '00' and '10' (SPP 4.1.3.4.2.3), and a receive port of the Octet String Service discards such packets (0x1A).
      - Use an APID that no other source of the managed data path uses and that is not the Idle APID 2047; the count of the instance is the Packet Sequence Count of the APID (SPP 4.1.3.4.3.3).
      - MAX_LENGTH of the core and TxBufferBytes_g of the send port hold the longest packet, 6 + SecHdrBytes_g + ChunkBytes_g bytes, plus 2 with Crc_g; a send buffer of two such packets lets the next packet enter while one leaves.
      - Change Cfg_Apid and Cfg_Type only while the packetizer holds no data; they are sampled per packet, and a change inside a data unit would split it between two APIDs.
      - Reset the packetizer together with the core (Rst, or the reset group of DpRst), or only while no packet is between it and the send port; a packet cut off by its reset would merge with the next one in the send buffer, which the core rejects (0x04).
      - A receiver finds the data units from the Sequence Flags ('01' or '11' starts one, '10' or '11' ends it) and a lost segment from a gap in the Packet Sequence Count of the APID; with Crc_g it checks every segment.
      - The packets are Space Packets of CCSDS 133.0-B-2, not PUS packets (ECSS-E-ST-70-41C uses only the Sequence Flags '11').
    rates:
      evidence: "specification PT-PF-01 (every packet one beat per clock cycle, at most 3 clock cycles between two packets) and PT-PF-02 (with BufferBytes_g at least twice ChunkBytes_g, at most the extra output beats of a packet plus 3 stall cycles per segment at the input); TC-PT-11 (hdl/spp_packetizer/docs/verification_report.md); with a smaller buffer the input waits while every packet leaves (user guide 4.7), counted here as one more packet per segment"
      packet: segment
      # H: the bytes a packet adds to its segment (primary header, secondary header, CRC); W: 1 with a buffer of less
      # than two segments
      vars: { B: DataWidth_g / 8, H: "6 + SecHdrBytes_g + 2 * Crc_g", W: "max(0, 1 - floor(BufferBytes_g / (2 * ChunkBytes_g)))" }
      interfaces:
        S: { bytesPerBeat: B, overheadCycles: "cdiv(n, ChunkBytes_g) * (cdiv(H, B) + 3 + W * (cdiv(ChunkBytes_g + H, B) + 3))" }
        M: { cycles: "cdiv(n, B) + 3" }
      routes:
        - { from: S, to: M, chunk: ChunkBytes_g, addBytes: H }
    sizes:
      evidence: "user guide section 4.7: every data unit is cut into segments of ChunkBytes_g bytes, each sent as one Space Packet"
      interfaces:
        S: { noLimit: true }
