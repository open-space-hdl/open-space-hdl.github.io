# Source repositories of the blocks, pinned to the commit (or tag) the catalog was checked against.
#
# Updating a core: set the new commit of main here, run "python tools/composer_catalog.py build" and
# "python tools/composer_catalog.py check"; the check reads every entity at the pinned commit.
#
#   file_list:        file of the repository that lists the sources in compile order
#   file_list_format: modules (one module directory per line, sources in <module>/src/*.vhd)
#                     or files (one VHDL file per line)
#   verified_with:    Open Logic FT tag the repository is verified with (its open-logic submodule)
#   note:             what a build of a system needs to know about the repository (shown in the brief)

sources:
  - id: openwire
    name: OpenWire
    repo: openwire
    url: https://github.com/open-space-hdl/openwire
    doc: https://openspacehdl.org/openwire/
    commit: 09e4b1f67be8ba0808a267ffdebd1c22c513e861
    library: openwire
    file_list: compile_order.txt
    file_list_format: files
    verified_with: 4.7.0-ft.6
    note: The submodules of the repository (open-logic, uvvm) serve its own tests; a system uses the olo library of the Composer.

  - id: openrmap
    name: OpenRMAP
    repo: openrmap
    url: https://github.com/open-space-hdl/openrmap
    doc: https://openspacehdl.org/openrmap/
    commit: e1e13d3ed369c06f3093c745d6b2f8da38d0eba0
    library: openrmap
    file_list: compile_order.txt
    file_list_format: files
    verified_with: 4.7.0-ft.6
    note: The submodules of the repository (open-logic, uvvm) serve its own tests; a system uses the olo library of the Composer.

  - id: openspp
    name: OpenSPP
    repo: openspp
    url: https://github.com/open-space-hdl/openspp
    doc: https://openspacehdl.org/openspp/
    commit: 018ebe17992d578dea037fa47251b3309a863bb8
    library: openspp
    file_list: compile_order.txt
    file_list_format: files
    verified_with: 4.7.0-ft.6
    note: The submodules of the repository (open-logic, uvvm) serve its own tests; a system uses the olo library of the Composer.

  - id: openfibre
    name: OpenFibre
    repo: openfibre
    url: https://github.com/open-space-hdl/openfibre
    doc: https://openspacehdl.org/openfibre/
    commit: 9fc03fb8b0d954501240b28fbeded14c5b5c70c6
    library: openfibre
    file_list: compile_order.txt
    file_list_format: files
    verified_with: 4.7.0-ft.6
    note: The submodules of the repository (open-logic, uvvm) serve its own tests; a system uses the olo library of the Composer. compile_order.txt lists the technology-independent sources; the vendor-specific physical adapter ofb_pa_gty is added separately (see its notes).

  - id: opencrypto
    name: OpenCrypto
    repo: opencrypto
    url: https://github.com/open-space-hdl/opencrypto
    doc: https://openspacehdl.org/opencrypto/
    commit: b835a4901c330e7e49ccc3dea13350e66e758ceb
    library: opencrypto
    file_list: compile_order.txt
    file_list_format: files
    verified_with: 4.7.0-ft.6
    note: The submodules of the repository (open-logic, uvvm) serve its own tests; a system uses the olo library of the Composer.

  - id: olo
    name: Open Logic FT
    repo: open-logic-ft
    url: https://github.com/open-space-hdl/open-logic-ft
    doc: https://openspacehdl.org/open-logic-ft/
    tag: 4.7.0-ft.6
    library: olo
    file_list: compile_order.txt
    file_list_format: files
    note: >-
      Clone with the submodule 3rdParty/en_cl_fix (git clone --recursive); compile_order.txt lists its files.
      4.7.0-ft.6 adds olo_base_chunker and olo_axi_lite_decoder to 4.7.0-ft.2 (ft.3), fixes the error reporting of
      olo_axi_master_simple and the write word count of olo_axi_master_full (ft.4), the address of transfers that
      olo_axi_master_simple splits at AxiMaxBeats_g (ft.5), and the transfers of olo_axi_master_full with 8-bit data
      and narrow addresses (ft.6). Every core of the catalog is verified with 4.7.0-ft.6.
