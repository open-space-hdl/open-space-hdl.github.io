# Source repositories of the blocks, pinned to the commit (or tag) the catalog was checked against.
#
# Updating a core: set the new commit of main here, run "python tools/composer_catalog.py build" and
# "python tools/composer_catalog.py check"; the check reads every entity at the pinned commit.
#
#   file_list:        file of the repository that lists the sources in compile order
#   file_list_format: modules (one module directory per line, sources in <module>/src/*.vhd)
#                     or files (one VHDL file per line)
#   verified_with:    Open Logic FT tag the repository is verified with (its open-logic submodule)
#   note:             what a build of a system needs to know about the repository (shown in the brief)

sources:
  - id: openwire
    name: OpenWire
    repo: openwire
    url: https://github.com/open-space-hdl/openwire
    doc: /openwire/
    commit: 09e4b1f67be8ba0808a267ffdebd1c22c513e861
    library: openwire
    file_list: compile_order.txt
    file_list_format: files
    verified_with: 4.7.0-ft.6
    note: The submodules of the repository (open-logic, uvvm) serve its own tests; a system uses the olo library of the Composer.

  - id: openrmap
    name: OpenRMAP
    repo: openrmap
    url: https://github.com/open-space-hdl/openrmap
    doc: /openrmap/
    commit: caac2f3e65abeeff365637c854a7b6a2036639f4
    library: openrmap
    file_list: compile_order.txt
    file_list_format: files
    verified_with: 4.7.0-ft.11
    note: The submodules of the repository (open-logic, uvvm) serve its own tests; a system uses the olo library of the Composer.

  - id: openspp
    name: OpenSPP
    repo: openspp
    url: https://github.com/open-space-hdl/openspp
    doc: /openspp/
    commit: 018ebe17992d578dea037fa47251b3309a863bb8
    library: openspp
    file_list: compile_order.txt
    file_list_format: files
    verified_with: 4.7.0-ft.6
    note: The submodules of the repository (open-logic, uvvm) serve its own tests; a system uses the olo library of the Composer.

  - id: openfibre
    name: OpenFibre
    repo: openfibre
    url: https://github.com/open-space-hdl/openfibre
    doc: /openfibre/
    commit: d1389f64862069666ed4f4290b729a6947885fe2
    library: openfibre
    file_list: compile_order.txt
    file_list_format: files
    verified_with: 4.7.0-ft.11
    note: The submodules of the repository (open-logic, uvvm) serve its own tests; a system uses the olo library of the Composer. compile_order.txt lists the technology-independent sources; the vendor-specific physical adapter ofb_pa_gty is added separately (see its notes).

  - id: opencrypto
    name: OpenCrypto
    repo: opencrypto
    url: https://github.com/open-space-hdl/opencrypto
    doc: /opencrypto/
    commit: b835a4901c330e7e49ccc3dea13350e66e758ceb
    library: opencrypto
    file_list: compile_order.txt
    file_list_format: files
    verified_with: 4.7.0-ft.6
    note: The submodules of the repository (open-logic, uvvm) serve its own tests; a system uses the olo library of the Composer.

  - id: opencompact
    name: OpenCompact
    repo: opencompact
    url: https://github.com/open-space-hdl/opencompact
    doc: /opencompact/
    commit: dd94c8395a81cf2b6925f33d8f4bbff9328cfcec
    branch: develop
    library: opencompact
    file_list: compile_order.txt
    file_list_format: files
    verified_with: 4.7.0-ft.9
    note: The submodules of the repository (open-logic, uvvm) serve its own tests; a system uses the olo library of the Composer.

  - id: olo
    name: Open Logic FT
    repo: open-logic-ft
    url: https://github.com/open-space-hdl/open-logic-ft
    doc: /open-logic-ft/
    tag: 4.7.0-ft.11
    library: olo
    file_list: compile_order.txt
    file_list_format: files
    note: >-
      Clone with the submodule 3rdParty/en_cl_fix (git clone --recursive); compile_order.txt lists its files.
      4.7.0-ft.6 adds olo_base_chunker and olo_axi_lite_decoder to 4.7.0-ft.2 (ft.3), fixes the error reporting of
      olo_axi_master_simple and the write word count of olo_axi_master_full (ft.4), the address of transfers that
      olo_axi_master_simple splits at AxiMaxBeats_g (ft.5), and the transfers of olo_axi_master_full with 8-bit data
      and narrow addresses (ft.6). 4.7.0-ft.8 adds the response code of a failed command to the AXI masters (outputs
      Wr_ErrorResp and Rd_ErrorResp), olo_intf_can and the Reed-Solomon codec (olo_base_rs_encode, olo_base_rs_decode),
      and fixes the beat counters of olo_axi_master_simple and the write word count of the largest commands of
      olo_axi_master_full (ft.7); it adds FIXED bursts to the AXI masters (inputs CmdWr_Fixed and CmdRd_Fixed, default
      '0'), olo_base_stream_join and olo_base_stream_split, drives Out_Be of olo_base_wconv_n2m with equal widths, and
      checks the byte enables of olo_base_wconv_n2m and the commands of olo_intf_i2c_master at the clock edge (ft.8).
      4.7.0-ft.11 lets olo_axi_master_full overlap consecutive commands and adds the generics IntFifoDepth_g and
      EccPipeline_g to the fault-tolerant AXI masters (ft.9), resets the read alignment register of olo_axi_master_full
      (ft.10), matches the scoped constraint of the read path of olo_base_ram_sdp also after synthesis retiming and
      checks In_Last and In_Be of olo_base_crc only for an accepted beat (ft.11). The cores of the catalog are verified
      with 4.7.0-ft.6 (OpenWire, OpenSPP, OpenCrypto, OpenCompact); 4.7.0-ft.11 (OpenRMAP, OpenFibre); the ports added since 4.7.0-ft.6 have a default (inputs) or may stay open (outputs), so every
      core compiles with 4.7.0-ft.11 unchanged.
