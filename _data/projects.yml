# One entry per project, shown as a card on the start page: grouped as in project_groups.yml, in this order within
# a group. The TRL page lists the projects in this order too.
#
#   repo:      repository name in github.com/open-space-hdl
#   group:     id of the group in project_groups.yml (a project without a known group is not shown on the start page)
#   tagline:   the standard the project implements, without the standards it refers to (ECSS-E-ST-50-53C refers to
#              CCSDS 133.0-B-2, CCSDS 352.0-B-2 to FIPS 197 and NIST SP 800-38D); without a standard: its key
#              techniques. Shown under the name and joined with ' · '; a line breaks only after a separator
#   summary:   one sentence of 100 to 140 characters: what the project is and what it does, without article, without
#              the word 'open' and without the standard (the tagline names it)
#   public:    true once the repository is public -> card links to the source
#   docs:      true once the repository publishes its own GitHub Pages site (MkDocs, tools/ of the repository)
#              -> card links to openspacehdl.org/<repo>/
#   trl:       technology readiness level (see trl.html, openspacehdl.org/trl/) -> badge on the card
#   trl_status: one sentence for the status table of the TRL page
#
# While public is false the card shows "Coming soon" and no links.

- name: OpenWire
  repo: openwire
  group: interfaces-protocols
  tagline: [ECSS-E-ST-50-12C Rev.1]
  summary: "SpaceWire port with node interface: Data-Strobe encoding, link control, packets, time-codes and distributed interrupts."
  public: true
  docs: true
  trl: 3
  trl_status: Fully verified by simulation. Not yet tested on hardware, no flight heritage.

- name: OpenFibre
  repo: openfibre
  group: interfaces-protocols
  tagline: [ECSS-E-ST-50-11C]
  summary: SpaceFibre port with 1 to 4 lanes, up to 32 virtual channels, quality of service, broadcast and error recovery.
  public: true
  docs: true
  trl: 3
  trl_status: Fully verified by simulation. Not yet tested on hardware, no flight heritage.

- name: OpenRMAP
  repo: openrmap
  group: interfaces-protocols
  tagline: [ECSS-E-ST-50-52C]
  summary: RMAP target and initiator for reading and writing remote memory over SpaceWire and SpaceFibre networks.
  public: true
  docs: true
  trl: 3
  trl_status: Fully verified by simulation. Not yet tested on hardware, no flight heritage.

- name: OpenSPP
  repo: openspp
  group: interfaces-protocols
  tagline: [ECSS-E-ST-50-53C]
  summary: Space Packet service with APID routing and loss detection for up to 16 send and 16 receive ports, over SpaceWire, SpaceFibre or other links.
  public: true
  docs: true
  trl: 3
  trl_status: Fully verified by simulation. Not yet tested on hardware, no flight heritage.

- name: OpenCompact
  repo: opencompact
  group: processing-modules
  tagline: [CCSDS 123.0-B-2]
  summary: Lossless and near-lossless compressor for multispectral and hyperspectral images, with all predictors and entropy coders of the standard.
  public: true
  docs: true
  trl: 3
  trl_status: Fully verified by simulation. Not yet tested on hardware, no flight heritage.

- name: OpenCrypto
  repo: opencrypto
  group: processing-modules
  tagline: [CCSDS 352.0-B-2]
  summary: Authenticated encryption and decryption of real-time data streams with AES-GCM, key table and IV generation.
  public: true
  docs: true
  trl: 3
  trl_status: Fully verified by simulation. Not yet tested on hardware, no flight heritage.

- name: Open Logic FT
  repo: open-logic-ft
  group: building-blocks
  tagline: [ECC, TMR, Safe FSMs]
  summary: "Fault-tolerant fork of Open Logic: RAMs and FIFOs with SECDED ECC, clock crossings with triplicated synchronisers."
  public: true
  docs: true
  trl: 3
  trl_status: Fully verified by simulation. Not yet tested on hardware, no flight heritage.
